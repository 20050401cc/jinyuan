    { id: 'untouched', api: 'ACH_UNTOUCHED', glyph: '净', color: '#8fb7ff', name: '毫发无伤', desc: '不受任何伤害击败一位守护者' },
    { id: 'speed', api: 'ACH_SPEEDRUN', glyph: '疾', color: '#fff27a', name: '疾行者', desc: '在 15 分钟内完成远征' },
    { id: 'arsenal', api: 'ACH_ARSENAL', glyph: '械', color: '#c59bff', name: '军械库', desc: '累计持有过全部 8 种武器' },
    { id: 'rich', api: 'ACH_RICH', glyph: '财', color: '#ffd24a', name: '拾荒之王', desc: '同时持有 300 枚金币' },
    { id: 'shopper', api: 'ACH_SHOPPER', glyph: '商', color: '#5dff8a', name: '常客', desc: '在商店累计购买 10 次' },
    { id: 'chests', api: 'ACH_CHESTS', glyph: '箱', color: '#e7b24a', name: '寻宝人', desc: '累计打开 15 个宝箱' },
    { id: 'perks', api: 'ACH_PERKS_5', glyph: '博', color: '#ff7ad1', name: '博采众长', desc: '一次远征中获得 5 项增益' },
    { id: 'dasher', api: 'ACH_DASH_300', glyph: '影', color: '#3ff0da', name: '残影步', desc: '累计闪避 300 次' },
    { id: 'blade', api: 'ACH_BLADE_BOSS', glyph: '刃', color: '#ff7ad1', name: '近身搏杀', desc: '用烬刃给守护者最后一击' },
    { id: 'fall', api: 'ACH_FIRST_FALL', glyph: '堕', color: '#a89ea8', name: '坠入余烬', desc: '第一次倒下' },
    { id: 'veteran', api: 'ACH_VETERAN', glyph: '老', color: '#ffb05a', name: '老兵', desc: '累计完成 3 次远征' }
  ];
  const A = G.ach = { list: LIST, unlocked: {}, stats: { kills: 0, chests: 0, buys: 0, dashes: 0, wins: 0, weapons: [] }, toasts: [] };

  function store() { try { localStorage.setItem(KEY, JSON.stringify({ u: A.unlocked, s: A.stats })); } catch (e) { /* 忽略 */ } }
  A.init = function () {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d) { A.unlocked = d.u || {}; Object.assign(A.stats, d.s || {}); }
    } catch (e) { /* 损坏时重置 */ }
    // 已解锁的成就在桌面版启动时补同步到 Steam
    if (G.desktop && G.desktop.achieve) for (const a of LIST) if (A.unlocked[a.id]) G.desktop.achieve(a.api);
  };
  A.count = () => LIST.filter(a => A.unlocked[a.id]).length;

  function unlock(id) {
    if (A.unlocked[id]) return;
    const a = LIST.find(x => x.id === id);
    if (!a) return;
    A.unlocked[id] = Date.now();
    A.toasts.push({ a, t: 0 });
    store();
    G.sfx('perk');
    if (G.desktop && G.desktop.achieve) G.desktop.achieve(a.api);
  }
  A.unlock = unlock;

  // 游戏事件
  A.ev = function (type, arg) {
    const g = G.game, s = A.stats;
    if (type === 'kill') { s.kills++; unlock('first_blood'); if (s.kills >= 300) unlock('slayer'); }
    else if (type === 'boss') {
      const n = arg.type === 'boss1' ? 'boss1' : arg.type === 'boss2' ? 'boss2' : 'boss3';
      unlock(n);
      if (g.dmgTaken === g.dmgAtBoss) unlock('untouched');
      const p = g.player;
      if (p && p.weapons[p.cur] === 'blade') unlock('blade');
    } else if (type === 'win') {
      s.wins++; unlock('boss3');
      if (g.runTime < 15 * 60) unlock('speed');
      if (s.wins >= 3) unlock('veteran');
    } else if (type === 'death') unlock('fall');
    else if (type === 'chest') { s.chests++; if (s.chests >= 15) unlock('chests'); }
    else if (type === 'buy') { s.buys++; if (s.buys >= 10) unlock('shopper'); }
    else if (type === 'dash') { s.dashes++; if (s.dashes >= 300) unlock('dasher'); }
    else if (type === 'weapon') { if (arg && s.weapons.indexOf(arg) < 0) { s.weapons.push(arg); if (s.weapons.length >= G.WEAPON_IDS.length) unlock('arsenal'); } }
    else if (type === 'perk') { if (g.perksTaken.length >= 5) unlock('perks'); }
    A.dirty = true;
  };

  let saveT = 0;
  A.tick = function (dt) {
    const g = G.game, p = g.player;
    if (g.state === 'play' && p && p.gold >= 300) unlock('rich');
    for (let i = A.toasts.length - 1; i >= 0; i--) { A.toasts[i].t += dt; if (A.toasts[i].t > 4) A.toasts.splice(i, 1); }
    saveT += dt;
    if (A.dirty && saveT > 3) { saveT = 0; A.dirty = false; store(); }
  };
  window.addEventListener('pagehide', store);

  // 解锁提示（右上角滑入）
  A.drawToasts = function (ctx) {
    A.toasts.slice(0, 3).forEach((o, i) => {
      const t = o.t, k = t < 0.35 ? 1 - Math.pow(1 - t / 0.35, 3) : t > 3.6 ? 1 - (t - 3.6) / 0.4 : 1;
      const w = 280, h = 58, x = G.W - 14 - w * k, y = 150 + i * 66;
      ctx.globalAlpha = Math.max(0, Math.min(1, k));
      G.ui.panel(ctx, x, y, w, h, o.a.color, 0.92);
      badge(ctx, x + 32, y + h / 2, 20, o.a, true);
      G.text(ctx, '成就解锁', x + 62, y + 18, 11, '#ffb05a', 'left', true);
      G.text(ctx, o.a.name, x + 62, y + 38, 16, '#fff', 'left', true);
      ctx.globalAlpha = 1;
    });
  };
  function badge(ctx, x, y, r, a, on) {
    ctx.save(); ctx.translate(x, y);
    G.poly(ctx, 6, r, Math.PI / 6); ctx.fillStyle = on ? '#17131c' : '#0e0c10'; ctx.fill();
    ctx.strokeStyle = on ? a.color : '#3a343e'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    G.text(ctx, on ? a.glyph : '?', x, y + 1, r * 0.85, on ? a.color : '#4a444e', 'center', true);
  }

  // 成就一览界面
  G.drawAchievements = function (ctx) {
    const g = G.game, U = G.ui;
    if (g.back === 'menu') G.drawMenuBackdrop(ctx);
    ctx.fillStyle = 'rgba(7,4,9,0.8)'; ctx.fillRect(0, 0, G.W, G.H);
    const w = 860, x0 = (G.W - w) / 2;
    U.panel(ctx, x0, 22, w, 560, '#ff9d4a', 0.92);
    U.glowText(ctx, '成 就', G.W / 2, 56, 34, '#ffe9c8', '#ff9d4a', true);
    G.text(ctx, A.count() + ' / ' + LIST.length, G.W / 2, 86, 13, '#c8b0a0', 'center', true);
    const s = A.stats;
    G.text(ctx, '累计击败 ' + s.kills + ' · 开箱 ' + s.chests + ' · 购买 ' + s.buys + ' · 闪避 ' + s.dashes + ' · 武器 ' + s.weapons.length + '/' + G.WEAPON_IDS.length, G.W / 2, 104, 11, '#8a8088', 'center');
    LIST.forEach((a, i) => {
      const col = i % 2, row = Math.floor(i / 2), x = x0 + 24 + col * 412, y = 120 + row * 50, on = !!A.unlocked[a.id];
      ctx.fillStyle = on ? 'rgba(255,176,90,0.07)' : 'rgba(255,255,255,0.025)'; U.rr(ctx, x, y, 400, 44, 6); ctx.fill();
      badge(ctx, x + 24, y + 22, 16, a, on);
      G.text(ctx, a.name, x + 50, y + 14, 14, on ? '#fff' : '#8a8088', 'left', true);
      G.text(ctx, a.desc, x + 50, y + 32, 11, on ? '#c8bcc0' : '#6a6470', 'left');
      if (on) G.text(ctx, '✓', x + 382, y + 22, 16, a.color, 'center', true);
    });
    if (G.button(ctx, G.W / 2 - 100, 524, 200, 42, '返回', true)) G.closeSub();
  };
})();

</script>
<script>
// 世界渲染：地图 → 物体 → 光照暗幕 → 发光层（子弹/火焰/特效）→ 氛围
'use strict';
(function () {
  const G = window.G;
  const TAU = Math.PI * 2, OUT = '#140e14';

  // 内嵌的开源字体（思源黑体 / 马善政楷书裁剪版），系统字体作后备
  G.FONT = '"JY Sans","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
  G.FONT_T = '"JY Brush","STXingkai","KaiTi",' + G.FONT;
  G.text = function (ctx, str, x, y, size, color, align, bold, title) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + (title ? G.FONT_T : G.FONT);
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  };
  // 带深色描边的文字（世界内飘字、提示）
  G.textO = function (ctx, str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px ' + G.FONT;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,6,10,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  };

  let vignette = null, redVig = null;
  G.resetHooks.push(() => { vignette = redVig = null; });
  function vig(inner, outer, color) {
    const c = G.mkCanvas(G.W, G.H), x = c.getContext('2d');
    const gr = x.createRadialGradient(G.W / 2, G.H / 2, inner, G.W / 2, G.H / 2, outer);
    gr.addColorStop(0, 'rgba(' + color + ',0)'); gr.addColorStop(1, 'rgba(' + color + ',0.75)');
    x.fillStyle = gr; x.fillRect(0, 0, G.W, G.H);
    return c;
  }

  function shadow(ctx, x, y, rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath(); ctx.ellipse(x, y, rx, rx * 0.38, 0, 0, TAU); ctx.fill();
  }

  function drawStains(ctx, g) {
    for (const s of g.stains) {
      ctx.globalAlpha = s.a; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.62, s.rot, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s.x + s.r * 0.8, s.y + s.r * 0.2, s.r * 0.35, s.r * 0.25, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawItems(ctx, g, th) {
    for (const it of g.items) {
      const bob = Math.sin(g.time * 3 + it.x) * 3;
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.kind === 'portal') {
        ctx.fillStyle = '#07050a'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 22, 0, 0, TAU); ctx.fill();
        for (let i = 0; i < 4; i++) {
          const r = 30 - i * 6, a = g.time * (1.6 + i * 0.7) * (i % 2 ? -1 : 1) + i;
          ctx.strokeStyle = i % 2 ? '#ffffff' : th.accent; ctx.lineWidth = 3.5 - i * 0.5; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(0, 0, r, a, a + 2.2); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, r, a + Math.PI, a + Math.PI + 2.2); ctx.stroke();
        }
        ctx.lineCap = 'butt';
        ctx.restore();
        continue;
      }
      if (it.price) {
        // 商店货架底座
        shadow(ctx, 0, 20, 18);
        ctx.beginPath(); ctx.moveTo(-13, 10); ctx.lineTo(13, 10); ctx.lineTo(16, 20); ctx.lineTo(-16, 20); ctx.closePath(); G.ink(ctx, '#4a4450', 2);
        ctx.fillStyle = '#6a6472'; ctx.fillRect(-13, 9, 26, 3);
      } else shadow(ctx, 0, 15, 14);
      if (it.kind === 'weapon') {
        ctx.translate(-13, bob - 2); ctx.rotate(-0.4);
        G.drawWeapon(ctx, it.wid, 1.5);
      } else if (it.kind === 'chest') {
        ctx.beginPath(); ctx.rect(-15, -3, 30, 17); G.ink(ctx, it.opened ? '#5a3c1c' : '#8a5a26', 2.2);
        ctx.fillStyle = it.opened ? '#8a6a30' : '#f0bb4e'; ctx.fillRect(-15, 4, 30, 3);
        ctx.fillRect(-10, -3, 3, 17); ctx.fillRect(7, -3, 3, 17);
        if (it.opened) {
          ctx.beginPath(); ctx.rect(-13, -7, 26, 6); G.ink(ctx, '#140c06', 2);
          ctx.beginPath(); ctx.moveTo(-15, -7); ctx.lineTo(-13, -17); ctx.lineTo(13, -17); ctx.lineTo(15, -7); ctx.closePath(); G.ink(ctx, '#6e4520', 2.2);
        } else {
          ctx.beginPath(); ctx.moveTo(-15, -3); ctx.quadraticCurveTo(-15, -16, 0, -16); ctx.quadraticCurveTo(15, -16, 15, -3); ctx.closePath(); G.ink(ctx, '#b47a2c', 2.2);
          ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(-5, -11, 6, 2, -0.2, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.rect(-3.5, -6, 7, 8); G.ink(ctx, '#fff3c4', 1.6);
          ctx.fillStyle = OUT; ctx.fillRect(-1, -3, 2, 3);
        }
      } else {
        ctx.translate(0, bob - 4);
        if (it.item === 'heal') {
          ctx.beginPath(); ctx.rect(-3.5, -14, 7, 7); G.ink(ctx, '#e8e8f0', 1.8);
          ctx.beginPath(); ctx.arc(0, 2, 10, 0, TAU); G.ink(ctx, '#ff5d6c', 2);
          ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-4, -2, 3, 5, 0.5, 0, TAU); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.fillRect(-1.5, -2.5, 3, 10); ctx.fillRect(-5, 1, 10, 3);
        } else if (it.item === 'energy') {
          ctx.beginPath(); ctx.rect(-3, -15, 6, 4); G.ink(ctx, '#8a909c', 1.6);
          ctx.beginPath(); ctx.rect(-8, -11, 16, 23); G.ink(ctx, '#27313c', 2);
          ctx.fillStyle = '#6fe0ff'; ctx.fillRect(-5, -8, 10, 17);
          ctx.fillStyle = '#eafcff'; ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(-3, 1); ctx.lineTo(0, 1); ctx.lineTo(-1, 7); ctx.lineTo(3, -1); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
        } else {
          G.poly(ctx, 6, 15, Math.PI / 6); G.ink(ctx, '#17131c', 2);
          ctx.strokeStyle = it.perk.color; ctx.lineWidth = 2; G.poly(ctx, 6, 11.5, Math.PI / 6); ctx.stroke();
          G.text(ctx, it.perk.glyph, 0, 1, 14, it.perk.color, 'center', true);
        }
      }
      ctx.restore();
    }
  }

  function drawPickups(ctx, g) {
    for (const k of g.pickups) {
      if (k.kind === 'coin') {
        const w = Math.abs(Math.cos(g.time * 6 + k.x)) * 4 + 1;
        ctx.beginPath(); ctx.ellipse(k.x, k.y, w, 5, 0, 0, TAU); G.ink(ctx, '#ffcf3e', 1.5);
        ctx.fillStyle = '#fff6c8'; ctx.fillRect(k.x - w * 0.35, k.y - 3, Math.max(1, w * 0.3), 4);
      } else if (k.kind === 'energy') {
        ctx.beginPath(); ctx.moveTo(k.x, k.y - 6); ctx.lineTo(k.x + 4.5, k.y); ctx.lineTo(k.x, k.y + 6); ctx.lineTo(k.x - 4.5, k.y); ctx.closePath(); G.ink(ctx, '#6fe0ff', 1.5);
        ctx.fillStyle = '#eafcff'; ctx.fillRect(k.x - 1, k.y - 3, 2, 3);
      } else {
        const s = 1 + Math.sin(g.time * 6 + k.y) * 0.1;
        ctx.save(); ctx.translate(k.x, k.y); ctx.scale(s, s);
        ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-9, -1, -5, -8, 0, -3); ctx.bezierCurveTo(5, -8, 9, -1, 0, 6); ctx.closePath(); G.ink(ctx, '#5dff8a', 1.5);
        ctx.restore();
      }
    }
  }

  function drawEnemies(ctx, g) {
    for (const e of g.enemies) {
      if (e.spawnT > 0) continue;
      const def = e.def;
      shadow(ctx, e.x, e.y + e.r * 0.85, e.r);
      ctx.save();
      ctx.translate(e.x, e.y);
      if (def.boss && e.alpha < 1) ctx.globalAlpha = Math.max(0.08, e.alpha);
      def.draw(ctx, e);
      ctx.restore();
    }
  }

  // 光照之后绘制：出生法阵、预警线、血条
  function drawEnemyOverlays(ctx, g) {
    for (const e of g.enemies) {
      const def = e.def;
      if (e.spawnT > 0) {
        const k = 1 - e.spawnT / (e.spawnMax || 1), R = e.r + 10;
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(1, 0.55);
        ctx.strokeStyle = def.color; ctx.globalAlpha = 0.35 + k * 0.6; ctx.lineWidth = 2;
        ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.arc(0, 0, R, g.time * 4, g.time * 4 + TAU); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(0, 0, R * k, 0, TAU); ctx.stroke();
        G.poly(ctx, 3, R * 0.8, -g.time * 3); ctx.stroke();
        ctx.restore();
        const gr = ctx.createLinearGradient(0, e.y - 46, 0, e.y);
        gr.addColorStop(0, G.rgba(def.color, 0)); gr.addColorStop(1, G.rgba(def.color, 0.5 * k));
        ctx.fillStyle = gr; ctx.fillRect(e.x - e.r * k, e.y - 46, e.r * 2 * k, 46);
        ctx.globalAlpha = 1;
        continue;
      }
      if ((e.type === 'gazer' && e.state === 'aim') || e.tele === 2) {
        const a = e.type === 'gazer' ? e.face : e.aimA, hit = G.raycast(e.x, e.y, a, 900), boss = def.boss;
        ctx.strokeStyle = boss ? 'rgba(255,80,50,0.3)' : 'rgba(255,90,110,0.28)'; ctx.lineWidth = boss ? 22 : 6;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(hit.x, hit.y); ctx.stroke();
        ctx.strokeStyle = boss ? 'rgba(255,220,180,0.8)' : 'rgba(255,200,210,0.85)'; ctx.lineWidth = 1.5;
        ctx.setLineDash([10, 7]); ctx.lineDashOffset = -g.time * 90;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(hit.x, hit.y); ctx.stroke(); ctx.setLineDash([]);
      }
      if (e.tele === 1) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.5 + Math.sin(g.time * 30) * 0.3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12 + (g.time * 60) % 14, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (!def.boss && e.hp < e.maxhp) {
        const w = Math.max(22, e.r * 2), x = e.x - w / 2, y = e.y - e.r - 12;
        ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, w + 2, 5);
        ctx.fillStyle = '#ff5d6c'; ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxhp), 3);
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxhp), 1);
      }
    }
  }

  // 发光层：火焰、子弹光晕、光束（加色混合）
  function drawGlowLayer(ctx, g, th) {
    const cam = g.cam, p = g.player;
    ctx.globalCompositeOperation = 'lighter';
    G.drawTorches(ctx, g, true);
    for (const it of g.items) {
      if (it.kind === 'chest' && it.opened) continue;
      const col = it.kind === 'portal' ? th.accent : it.kind === 'weapon' ? G.WEAPONS[it.wid].color : it.kind === 'chest' ? '#ffd86b' : it.item === 'heal' ? '#ff5d6c' : it.item === 'energy' ? '#6fe0ff' : it.perk.color;
      G.glow(ctx, col, it.x, it.y, it.kind === 'portal' ? 70 + Math.sin(g.time * 4) * 8 : 30, it.kind === 'portal' ? 0.6 : 0.3);
    }
    for (const k of g.pickups) G.glow(ctx, k.kind === 'coin' ? '#ffcf3e' : k.kind === 'energy' ? '#6fe0ff' : '#5dff8a', k.x, k.y, 12, 0.35);
    for (const b of g.bullets) G.glow(ctx, b.color, b.x, b.y, b.r * 4.2, 0.6);
    for (const e of g.enemies) if (e.def.boss && e.spawnT <= 0) G.glow(ctx, e.def.color, e.x, e.y, e.r * 3 + Math.sin(g.time * 5) * 6, 0.28);
    if (p.beam) {
      const b = p.beam;
      ctx.globalAlpha = 0.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#3fd8ff'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      G.glow(ctx, '#7af0ff', b.x2, b.y2, 26 + Math.random() * 8, 0.9);
      G.glow(ctx, '#7af0ff', b.x1, b.y1, 16, 0.8);
      ctx.lineCap = 'butt';
    }
    if (p.muzzle > 0) G.glow(ctx, G.WEAPONS[p.weapons[p.cur]].color, p.x + Math.cos(p.aim) * 26, p.y + Math.sin(p.aim) * 26, 30 * p.muzzle + 8, 0.85);
    for (const q of g.particles) {
      if (q.tri) continue;
      ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawBullets(ctx, g) {
    ctx.lineCap = 'round';
    for (const b of g.bullets) {
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, L = Math.min(18, sp * 0.028);
      ctx.strokeStyle = b.color; ctx.lineWidth = b.r * 2;
      ctx.beginPath(); ctx.moveTo(b.x - ux * L, b.y - uy * L); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = b.r;

        ctx.beginPath(); ctx.arc(e.x, e.y, e.rad * (0.2 + k * 0.8), 0, TAU); ctx.stroke();
      } else if (e.type === 'slash') {
        const p = g.player, a0 = e.ang - e.arc / 2, a1 = a0 + e.arc * Math.min(1, k * 2.2 + 0.25);
        ctx.globalAlpha = 1 - k; ctx.lineCap = 'round';
        ctx.strokeStyle = e.color; ctx.lineWidth = 18 * (1 - k) + 2;

        ctx.beginPath(); ctx.arc(p.x, p.y, e.range - 6, a0, a1); ctx.stroke(); ctx.lineCap = 'butt';

      } else if (e.type === 'dust') {

    for (const t of g.texts) {
      const k = t.t / t.dur, s = t.size * (k < 0.15 ? 1 + (0.15 - k) * 4 : 1);
      ctx.globalAlpha = 1 - Math.pow(k, 3);

  G.drawWorld = function (ctx) {

    drawStains(ctx, g);
    G.drawDoors(ctx, g, th);
    G.drawTorches(ctx, g, false);
    drawItems(ctx, g, th);
    drawPickups(ctx, g);
    drawEnemies(ctx, g);

<script>
// 界面：HUD、小地图、主菜单、暂停、增益选择、结算、准星
'use strict';
(function () {
  const G = window.G;

    ctx.beginPath();

      ctx.beginPath(); ctx.moveTo(x + w - 1, y + h - 13); ctx.lineTo(x + w - 1, y + h - 5); ctx.quadraticCurveTo(x + w - 1, y + h - 1, x + w - 5, y + h - 1); ctx.lineTo(x + w - 13, y + h - 1); ctx.stroke();
    }
  }
  // 即时模式按钮：绘制并返回本帧是否被点击
  G.button = function (ctx, x, y, w, h, label, primary) {

    else { gr.addColorStop(0, hover ? '#4a4252' : '#332d3a'); gr.addColorStop(1, hover ? '#322c38' : '#201c26'); }

    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(x + 6, y + 2, w - 12, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 4, y + h - 4, w - 8, 2);
    text(ctx, label, x + w / 2, y + h / 2, h < 36 ? 13 : 17, primary ? '#2a1204' : '#f0eaf2', 'center', true);
    if (it.click) { G.sfx('ui'); return true; }

  };

  // 当前操作方式对应的两行操作提示
  G.controlHints = function () {
    if (G.touch.on) return G.motion.status === 'ok'
      ? ['倾斜设备移动 · 右半屏拖动瞄准射击', '甩动或「闪」闪避 · 点武器栏换枪 · 「E」互动']
      : ['左半屏拖动移动 · 右半屏拖动瞄准射击', '「闪」闪避 · 点武器栏换枪 · 「E」互动'];
    if (G.settings.inputMode === 'pad' || G.pad.active) return ['左摇杆移动 · 右摇杆瞄准 · RT 射击', 'A 闪避 · Y 切换武器 · X 互动 · Start 暂停'];
    return ['WASD 移动 · 鼠标瞄准 · 左键射击', '空格 闪避 · Q 切换武器 · E 互动'];
  };

  const ICON = {
    heart(ctx, x, y) { ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.bezierCurveTo(x - 10, y - 1, x - 5, y - 9, x, y - 3); ctx.bezierCurveTo(x + 5, y - 9, x + 10, y - 1, x, y + 6); ctx.closePath(); },
    shield(ctx, x, y) { ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6.5, y - 4); ctx.lineTo(x + 6, y + 2); ctx.quadraticCurveTo(x + 4, y + 6, x, y + 8); ctx.quadraticCurveTo(x - 4, y + 6, x - 6, y + 2); ctx.lineTo(x - 6.5, y - 4); ctx.closePath(); },
    bolt(ctx, x, y) { ctx.beginPath(); ctx.moveTo(x + 2, y - 8); ctx.lineTo(x - 5, y + 1); ctx.lineTo(x - 0.5, y + 1); ctx.lineTo(x - 2, y + 8); ctx.lineTo(x + 5, y - 1.5); ctx.lineTo(x + 0.5, y - 1.5); ctx.closePath(); }

  // 斜切资源条：底槽 → 掉血残影 → 渐变填充 → 刻度 → 数值

    const sk = 8;
    const shape = ww => { ctx.beginPath(); ctx.moveTo(x + sk, y); ctx.lineTo(x + sk + ww, y); ctx.lineTo(x + ww, y + h); ctx.lineTo(x, y + h); ctx.closePath(); };

    if (lagFrac > frac + 0.005) { shape(w * G.clamp(lagFrac, 0, 1)); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill(); }
    if (frac > 0.005) {
      const gr = ctx.createLinearGradient(0, y, 0, y + h);
      gr.addColorStop(0, G.shade(color, 0.35)); gr.addColorStop(0.5, color); gr.addColorStop(1, G.shade(color, -0.35));

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x, y + 1, w + sk, 2);

    ICON[icon](ctx, x - 13, y + h / 2); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#140e14'; ctx.lineWidth = 1.5; ctx.stroke();
    G.textO(ctx, val, x + w / 2 + 4, y + h / 2 + 0.5, 11, '#fff', 'center');
  }

  const ROOM_COLOR = { start: '#cfd6e0', combat: '#9a9fae', chest: '#ffd24a', shop: '#5dff8a', boss: '#ff5d6c' };
  function minimap(ctx, g, th) {
    const d = g.dungeon, N = G.GRID_N, cw = 27, ch = 19, ox = G.W - 18 - N * cw, oy = 18;
    panel(ctx, ox - 9, oy - 9, N * cw + 18, N * ch + 18, th.accent, 0.72);
    const cx = r => ox + r.gx * cw + cw / 2, cy = r => oy + r.gy * ch + ch / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 3;
    for (const a of d.rooms) for (const j of a.links) {
      const b = d.rooms[j];
      if (b.id < a.id || !(a.visited || b.visited)) continue;
      ctx.beginPath(); ctx.moveTo(cx(a), cy(a)); ctx.lineTo(cx(b), cy(b)); ctx.stroke();
    }
    for (const r of d.rooms) {
      if (!r.seen) continue;
      const w = 9 + r.w * 0.55, h = 7 + r.h * 0.5, x = cx(r) - w / 2, y = cy(r) - h / 2, col = ROOM_COLOR[r.type];
      if (r.visited) {
        ctx.fillStyle = '#140e14'; rr(ctx, x - 1, y - 1, w + 2, h + 2, 2); ctx.fill();
        ctx.globalAlpha = r.cleared || r.type !== 'combat' ? 0.95 : 0.55;
        ctx.fillStyle = col; rr(ctx, x, y, w, h, 2); ctx.fill(); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(ctx, x, y, w, h, 2); ctx.fill();
        ctx.strokeStyle = r.type === 'boss' ? col : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
        if (r.type === 'boss') { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx(r), cy(r) - 3.5); ctx.lineTo(cx(r) + 3.5, cy(r)); ctx.lineTo(cx(r), cy(r) + 3.5); ctx.lineTo(cx(r) - 3.5, cy(r)); ctx.fill(); }
      }
      if (r === g.room) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6 + Math.sin(g.time * 5) * 0.4;
        rr(ctx, x - 3, y - 3, w + 6, h + 6, 3); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    const S = G.TILE, p = g.player;
    ctx.fillStyle = '#140e14'; ctx.beginPath(); ctx.arc(ox + p.x / S / 28 * cw, oy + p.y / S / 22 * ch, 3.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3ff0da'; ctx.beginPath(); ctx.arc(ox + p.x / S / 28 * cw, oy + p.y / S / 22 * ch, 2.4, 0, TAU); ctx.fill();
  }

  function divider(ctx, x, y, w, color) {
    const gr = ctx.createLinearGradient(x - w, 0, x + w, 0);
    gr.addColorStop(0, G.rgba(color, 0)); gr.addColorStop(0.5, G.rgba(color, 0.9)); gr.addColorStop(1, G.rgba(color, 0));
    ctx.fillStyle = gr; ctx.fillRect(x - w, y, w * 2, 1.5);
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 4, y + 0.7); ctx.lineTo(x, y + 5.5); ctx.lineTo(x - 4, y + 0.7); ctx.fill();
  }
  function glowText(ctx, str, x, y, size, color, glow, title) {
    ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 22;
    G.text(ctx, str, x, y, size, color, 'center', true, title);
    ctx.restore();
  }

  G.drawHUD = function (ctx) {
    const g = G.game, p = g.player, th = G.theme();

    // 左上：层数徽章、金币、击杀
    panel(ctx, 14, 12, 206, 58, th.accent, 0.72);
    ctx.save(); ctx.translate(42, 41); G.poly(ctx, 6, 19, Math.PI / 6); ctx.fillStyle = '#140e14'; ctx.fill(); ctx.strokeStyle = th.accent; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    text(ctx, String(g.floor), 42, 42, 20, th.accent, 'center', true);
    text(ctx, th.name, 70, 31, 16, '#f4ece4', 'left', true);
    ctx.beginPath(); ctx.ellipse(77, 53, 5, 6, 0, 0, TAU); ctx.fillStyle = '#ffcf3e'; ctx.fill(); ctx.strokeStyle = '#140e14'; ctx.lineWidth = 1.5; ctx.stroke();
    text(ctx, String(p.gold), 88, 54, 14, '#ffe9a8', 'left', true);
    text(ctx, '击杀 ' + g.kills, 138, 54, 12, '#a89ea8', 'left');

    minimap(ctx, g, th);

    // 左下：生命 / 护盾 / 能量

    bar(ctx, bx, by, 190, 17, hf, lag.hp, hf < 0.3 && Math.sin(g.time * 10) > 0 ? '#ff9aa4' : '#ff5d6c', 'heart', Math.ceil(p.hp) + ' / ' + p.maxHp, Math.round(p.maxHp / 25));
    bar(ctx, bx, by + 24, 190, 15, p.shield / p.maxShield, 0, '#8fb7ff', 'shield', Math.floor(p.shield) + ' / ' + p.maxShield, Math.round(p.maxShield / 10));
    bar(ctx, bx, by + 46, 190, 15, p.energy / p.maxEnergy, 0, '#5fd8f5', 'bolt', Math.floor(p.energy) + ' / ' + p.maxEnergy, Math.round(p.maxEnergy / 20));
    // 闪避冷却
    const dk = G.clamp(1 - p.dashCd / p.stats.dashCd, 0, 1), dx = 306, dy = G.H - 46;
    ctx.fillStyle = 'rgba(12,9,14,0.75)'; ctx.beginPath(); ctx.arc(dx, dy, 21, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(dx, dy, 17, 0, TAU); ctx.stroke();
    ctx.strokeStyle = dk >= 1 ? '#3ff0da' : '#8a8490'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(dx, dy, 17, -Math.PI / 2, -Math.PI / 2 + TAU * dk); ctx.stroke(); ctx.lineCap = 'butt';
    ctx.fillStyle = dk >= 1 ? '#3ff0da' : '#8a8490';
    for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.4 + i * 0.3; ctx.beginPath(); ctx.moveTo(dx - 9 + i * 6, dy - 5); ctx.lineTo(dx - 3 + i * 6, dy); ctx.lineTo(dx - 9 + i * 6, dy + 5); ctx.lineTo(dx - 7 + i * 6, dy); ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!G.touch.on) text(ctx, G.keyName('dash'), dx, dy + 31, 10, '#8a8490', 'center');

      const id = p.weapons[i], cur = i === p.cur, w = cur ? 196 : 176, h = cur ? 50 : 40;

      const wd = id && G.WEAPONS[id];
      panel(ctx, x, y, w, h, cur && wd ? wd.color : null, cur ? 0.86 : 0.5);
      ctx.fillStyle = cur ? '#f7a653' : '#4a4450'; rr(ctx, x + 7, y + h / 2 - 9, 17, 18, 4); ctx.fill();
      text(ctx, String(i + 1), x + 15.5, y + h / 2 + 0.5, 12, cur ? '#2a1204' : '#aaa', 'center', true);
      if (!wd) { text(ctx, '空 槽', x + w / 2 + 10, y + h / 2, 13, '#6a6470', 'center'); continue; }

      if (cur) { ctx.globalCompositeOperation = 'lighter'; G.glow(ctx, wd.color, 16, 0, 26, 0.35); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
      G.drawWeapon(ctx, id, cur ? 1.5 : 1.2); ctx.restore();
      text(ctx, wd.name, x + 84, y + h / 2 - (cur ? 8 : 0), cur ? 15 : 13, cur ? '#fff' : '#9a94a0', 'left', true);
      if (cur) {
        const c = wd.cost * p.stats.costMul;
        text(ctx, c ? '耗能 ' + (Math.round(c * 10) / 10) : '不耗能量', x + 84, y + h / 2 + 11, 11, c ? '#6fe0ff' : '#9dff8a', 'left');
      }
    }

    // Boss 血条
    if (g.boss && g.boss.spawnT <= 0) {
      const b = g.boss, w = 440, x = (G.W - w) / 2, y = 34, f = Math.max(0, b.hp / b.maxhp);
      lag.boss = f > lag.boss ? f : Math.max(f, lag.boss - 0.004);
      glowText(ctx, b.def.name, G.W / 2, y - 14, 22, '#fff', b.def.color, true);
      ctx.fillStyle = 'rgba(8,6,10,0.8)'; rr(ctx, x - 3, y, w + 6, 16, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x, y + 3, w * lag.boss, 10);
      const gr = ctx.createLinearGradient(0, y + 3, 0, y + 13);
      gr.addColorStop(0, G.shade(b.def.color, 0.4)); gr.addColorStop(1, G.shade(b.def.color, -0.3));

    ctx.globalCompositeOperation = 'lighter'; G.glow(ctx, col, G.W / 2, 110, 300, 0.25 * a); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
    glowText(ctx, win ? '远征完成' : '远征失败', G.W / 2, 104 - (1 - a) * 20, 76, win ? '#fff0d8' : '#ffd0d4', col, true);
    divider(ctx, G.W / 2, 152, 200, col);
    text(ctx, win ? '烬渊之心已熄灭，你带着余温回到地面。' : '你倒在了第 ' + g.floor + ' 层 · ' + G.theme().name, G.W / 2, 178, 15, '#c8bcc0', 'center');
    panel(ctx, G.W / 2 - 230, 204, 460, 176, col, 0.8);
    const m = Math.floor(g.runTime / 60), s = Math.floor(g.runTime % 60);
    const rows = [['抵达层数', g.floor + ' / ' + G.MAX_FLOOR], ['击杀敌人', g.kills], ['获得金币', g.goldTotal], ['用时', m + ' 分 ' + (s < 10 ? '0' : '') + s + ' 秒'], ['承受伤害', g.dmgTaken]];
    rows.forEach((r, i) => {
      const ra = G.clamp((g.stateT - 0.6 - i * 0.08) / 0.25, 0, 1), y = 230 + i * 31;
      ctx.globalAlpha = ra * a;
      text(ctx, r[0], G.W / 2 - 200, y, 15, '#a89ea8', 'left');
      text(ctx, String(r[1]), G.W / 2 + 200, y, 16, '#fff', 'right', true);
      if (i < 4) { ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(G.W / 2 - 200, y + 15, 400, 1); }
    });
    ctx.globalAlpha = a;
    if (g.perksTaken.length) perkRow(ctx, g, 414);
    ctx.globalAlpha = 1;
    if (g.stateT > 0.8) {
      if (G.button(ctx, G.W / 2 - 215, 460, 205, 52, '再来一次', true)) G.newRun();
      if (G.button(ctx, G.W / 2 + 10, 460, 205, 52, '返回主菜单')) g.state = 'menu';
      if (!G.touch.on) text(ctx, G.pad.active ? '按 A 确认' : '按 R 立即重开', G.W / 2, 540, 12, '#8a8088', 'center');
    }
  };

  G.ui = { rr, panel, divider, glowText, wrap };

  // 准星（战斗中）与箭头光标（界面中）
  G.drawCursor = function (ctx) {
    const g = G.game, I = G.input, x = I.mx, y = I.my;
    if (g.state === 'play') {
      const p = g.player, k = 6 + (p ? p.recoil * 5 : 0);
      ctx.lineCap = 'round';
      for (const [col, lw] of [['rgba(10,6,10,0.8)', 4.5], ['#fff', 2]]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * k, y + Math.sin(a) * k); ctx.lineTo(x + Math.cos(a) * (k + 6), y + Math.sin(a) * (k + 6)); ctx.stroke(); }
      }
      ctx.lineCap = 'butt';
      ctx.fillStyle = '#ff9d4a'; ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 13, y + 13); ctx.lineTo(x + 6, y + 13); ctx.lineTo(x + 3, y + 19); ctx.lineTo(x, y + 18); ctx.closePath();
      ctx.fillStyle = '#fff3e0'; ctx.fill(); ctx.strokeStyle = '#140e14'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
    }
  };
})();

</script>
<script>
// 主循环与流程：开局、换层、结算、状态机
'use strict';
(function () {
  const G = window.G;
  G.MAX_FLOOR = 3;

  const g = G.game = {
    state: 'menu', stateT: 0, time: 0, floor: 1, dmgMul: 1,
    dungeon: null, player: null, room: null, active: null, boss: null,
    enemies: [], bullets: [], ebullets: [], pickups: [], items: [], particles: [], texts: [], effects: [], stains: [], fade: 0,
    cam: { x: 0, y: 0 }, shake: 0, banner: null, winT: -1,
    runTime: 0, kills: 0, goldTotal: 0, dmgTaken: 0, dmgDealt: 0, perkChoices: [], perksTaken: []
  };

  G.startFloor = function (n) {
    g.floor = n;
    g.dmgMul = 1 + 0.2 * (n - 1);
    g.enemies.length = g.bullets.length = g.ebullets.length = 0;
    g.pickups.length = g.items.length = g.particles.length = g.texts.length = g.effects.length = g.stains.length = 0;
    g.fade = 1;
    g.active = null; g.boss = null; g.winT = -1; g.shake = 0;
    g.dungeon = G.genDungeon(n);
    G.decorate(g.dungeon);
    const p = g.player, st = g.dungeon.start;
    p.x = st.cx; p.y = st.cy;
    p.shield = p.maxShield; p.dashT = 0; p.invuln = 1; p.beam = null; p.near = null;
    g.room = st;
    G.stockRooms();
    g.cam.x = p.x - G.W / 2; g.cam.y = p.y - G.H / 2;
    G.prebakeNear(g.dungeon, p.x, p.y);
    G.save.timer = 1.5;
    g.banner = { text: '第 ' + n + ' 层 · ' + G.THEMES[Math.min(n, 3) - 1].name, t: 2.4 };
  };

  G.newRun = function () {
    G.save.clear();
    g.player = G.createPlayer();
    g.runTime = 0; g.kills = 0; g.goldTotal = 0; g.dmgTaken = 0; g.dmgDealt = 0;
    g.perksTaken = []; g.perkChoices = [];
    G.startFloor(1);
    G.ach.ev('weapon', 'pistol');
    g.state = 'play'; g.stateT = 0;
    G.input.down = false;
  };

  G.endRun = function (win) {
    if (g.state !== 'play') return;
    g.state = win ? 'win' : 'dead';
    g.banner = null;
    G.save.clear();
    G.save.record(win, g.floor);
    G.sfx(win ? 'win' : 'death');
    G.ach.ev(win ? 'win' : 'death');
    if (!win) G.rumble(1, 1, 450);
    g.stateT = 0;
    if (!win) { G.burst(g.player.x, g.player.y, '#35d0bd', 30, 260, 0.8, 4); g.shake = 16; }
  };

  function updatePlay(dt) {
    const I = G.input, p = g.player;
    g.runTime += dt;
    G.updatePlayer(dt);
    if (g.state !== 'play') return;
    G.updateRooms();
    G.updateEnemies(dt);
    G.updateBullets(dt);
    G.updatePickups(dt);
    G.updateFx(dt);
    const tx = p.x - G.W / 2 + (I.mx - G.W / 2) * 0.18, ty = p.y - G.H / 2 + (I.my - G.H / 2) * 0.18;
    const k = 1 - Math.exp(-10 * dt);
    g.cam.x += (tx - g.cam.x) * k; g.cam.y += (ty - g.cam.y) * k;
    g.shake *= Math.pow(0.0015, dt);
    if (g.banner) g.banner.t -= dt;
    if (g.winT > 0) { g.winT -= dt; if (g.winT <= 0) G.endRun(true); }
    G.save.auto(dt);
  }

  G.update = function (dt) {
    const I = G.input;
    G.updatePad(dt);
    G.updateMotion();
    G.updateTouch();
    g.time += dt; g.stateT += dt;
    if (g.dungeon) G.prebake(g.dungeon);
    if (g.fade > 0 && g.state !== 'perk') g.fade = Math.max(0, g.fade - dt * 1.6);
    if (I.pressed.KeyM) G.audio.muted = !G.audio.muted;
    if (I.pressed.F3) { G.settings.fps = G.debug.fps = !G.debug.fps; G.saveSettings(); }
    G.ach.tick(dt);
    if ((g.cfgT = (g.cfgT || 0) + dt) > 1) { g.cfgT = 0; G.save.syncCfg(); }
    switch (g.state) {
      case 'menu':
        break;
      case 'settings':
      case 'ach':
        if (I.pressed.Escape || G.nav.back) G.closeSub();
        break;
      case 'play':
        if (I.pressed.Escape || I.pressed.KeyP) { g.state = 'pause'; g.stateT = 0; G.save.write(); break; }
        updatePlay(dt);
        break;
      case 'pause':
        if (I.pressed.Escape || I.pressed.KeyP || G.nav.back) g.state = 'play';
        break;
      case 'dead':
      case 'win':
        G.updateFx(dt);
        g.shake *= Math.pow(0.0015, dt);
        if (g.stateT > 0.5 && I.pressed.KeyR) G.newRun();
        break;
    }
  };

  let ctx = null;
  G.draw = function () {
    G.navBeginFrame();
    ctx.setTransform(G.pxk, 0, 0, G.pxk, 0, 0);
    G.motion.rect = null;
    const sub = g.state === 'settings' || g.state === 'ach';
    if (g.state === 'menu' || (sub && g.back === 'menu')) {
      if (g.state === 'menu') G.drawMenu(ctx);
      else if (g.state === 'settings') G.drawSettings(ctx);
      else G.drawAchievements(ctx);
      G.warm(ctx);
    } else {
      G.drawWorld(ctx);
      G.drawHUD(ctx);
      G.drawTouch(ctx);
      if (g.fade > 0) { ctx.fillStyle = 'rgba(4,2,5,' + g.fade.toFixed(3) + ')'; ctx.fillRect(0, 0, G.W, G.H); }
      if (g.state === 'pause') G.drawPause(ctx);
      else if (g.state === 'perk') G.drawPerk(ctx);
      else if (g.state === 'dead') G.drawEnd(ctx, false);
      else if (g.state === 'win') G.drawEnd(ctx, true);
      else if (g.state === 'settings') G.drawSettings(ctx);
      else if (g.state === 'ach') G.drawAchievements(ctx);
    }
    G.ach.drawToasts(ctx);
    if (!G.touch.on && !(G.pad.active && g.state !== 'play')) G.drawCursor(ctx);
    G.drawRotateHint(ctx);
  };

  // 单步推进（主循环与调试共用）
  G.tick = function (dt) {
    G.update(dt);
    G.draw();
    G.navEndFrame();
    G.endFrameInput();
  };

  window.addEventListener('load', () => {
    const canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    if (document.fonts) for (const f of ['16px "JY Sans"', 'bold 16px "JY Sans"', '16px "JY Brush"']) document.fonts.load(f).catch(() => {});
    G.initInput(canvas);
    G.initTouch(canvas);
    G.initMotion(canvas);
    G.save.init();
    G.initSettings();
    G.ach.init();
    G.fit(canvas);
    window.addEventListener('resize', () => G.fit());
    window.addEventListener('blur', () => { if (g.state === 'play') { g.state = 'pause'; g.stateT = 0; } });
    document.addEventListener('visibilitychange', () => { if (document.hidden && g.state === 'play') g.state = 'pause'; });
    let last = performance.now();
    G.fps = 60;
    function frame(ts) {
      let dt = (ts - last) / 1000;
      last = ts;
      if (dt > 0) G.fps = G.fps * 0.92 + (1 / dt) * 0.08;
      if (dt > 0.05) dt = 0.05;
      if (!G.debug.manual) G.tick(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();

</script>
</body>
