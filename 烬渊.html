<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>烬渊 · 地牢远征</title>
<style>
  html, body { margin: 0; height: 100%; background: #060506; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0d0a09; cursor: none; touch-action: none; image-rendering: auto; box-shadow: 0 0 60px rgba(255, 140, 60, 0.12); }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<script>
// 核心：命名空间、数学工具、键鼠输入
'use strict';
(function () {
  const G = window.G = { W: 960, H: 600, TILE: 32, debug: { god: false, fps: false } };

  G.rand = (a, b) => a + Math.random() * (b - a);
  G.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  G.pick = a => a[Math.floor(Math.random() * a.length)];
  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  G.angDiff = (a, b) => {
    let d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  };
  // 点到线段距离
  G.segDist = (px, py, x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
    t = G.clamp(t, 0, 1);
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  };

  // ---------- 输入 ----------
  const input = G.input = { keys: {}, pressed: {}, mx: 480, my: 300, down: false, clicked: false, wheel: 0 };
  G.initInput = function (canvas) {
    const setMouse = e => {
      const r = canvas.getBoundingClientRect();
      input.mx = (e.clientX - r.left) / r.width * G.W;
      input.my = (e.clientY - r.top) / r.height * G.H;
    };
    window.addEventListener('keydown', e => {
      const k = e.code;
      if (!input.keys[k]) input.pressed[k] = true;
      input.keys[k] = true;
      if (k === 'Space' || k === 'Tab' || k.indexOf('Arrow') === 0) e.preventDefault();
      G.audio.unlock();
    });
    window.addEventListener('keyup', e => { input.keys[e.code] = false; });
    window.addEventListener('blur', () => { input.keys = {}; input.down = false; });
    window.addEventListener('mousemove', setMouse);
    canvas.addEventListener('mousedown', e => {
      setMouse(e);
      if (e.button === 0) { input.down = true; input.clicked = true; }
      G.audio.unlock();
    });
    window.addEventListener('mouseup', e => { if (e.button === 0) input.down = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { input.wheel = e.deltaY > 0 ? 1 : -1; e.preventDefault(); }, { passive: false });
  };
  G.endFrameInput = function () { input.pressed = {}; input.clicked = false; input.wheel = 0; };

})();

</script>
<script>
// 声音：全部用 Web Audio 实时合成 —— 分层音效 + 随场景变化的生成式背景音乐
'use strict';
(function () {
  const G = window.G;
  const A = G.audio = { ctx: null, failed: false, last: {}, _muted: false, musicOn: true };
  Object.defineProperty(A, 'muted', {
    get() { return A._muted; },
    set(v) { A._muted = !!v; if (A.master) A.master.gain.setTargetAtTime(v ? 0 : 0.9, A.ctx.currentTime, 0.03); }
  });

  A.unlock = function () {
    if (A.failed) return;
    if (A.ctx) { if (A.ctx.state === 'suspended' && !document.hidden) A.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext, c = A.ctx = new AC();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.18;
      A.master = c.createGain(); A.master.gain.value = A._muted ? 0 : 0.9;
      A.master.connect(comp); comp.connect(c.destination);
      A.sfxBus = c.createGain(); A.sfxBus.gain.value = 0.5; A.sfxBus.connect(A.master);
      A.musBus = c.createGain(); A.musBus.gain.value = 0.4; A.musBus.connect(A.master);
      // 简易空间感：两条交叉反馈的延迟线
      A.echo = c.createGain(); A.echo.gain.value = 1;
      const d1 = c.createDelay(1), d2 = c.createDelay(1), fb = c.createGain(), lp = c.createBiquadFilter(), wet = c.createGain();
      d1.delayTime.value = 0.23; d2.delayTime.value = 0.37; fb.gain.value = 0.42; lp.type = 'lowpass'; lp.frequency.value = 2200; wet.gain.value = 0.5;
      A.echo.connect(d1); d1.connect(d2); d2.connect(lp); lp.connect(fb); fb.connect(d1);
      d1.connect(wet); d2.connect(wet); wet.connect(A.master);
      const len = c.sampleRate;
      A.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = A.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      A.tick = schedule;
      setInterval(schedule, 60);
    } catch (err) { A.ctx = null; A.failed = true; }
  };
  document.addEventListener('visibilitychange', () => {
    if (!A.ctx) return;
    if (document.hidden) A.ctx.suspend(); else A.ctx.resume();
  });

  // ---------- 基础发声器 ----------
  let pm = 1; // 当前音效的随机音高系数
  function tone(type, f0, f1, dur, vol, at, bus, send) {
    const c = A.ctx, t = (at || c.currentTime), o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0 * pm, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * pm), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(bus || A.sfxBus);
    if (send) { const s = c.createGain(); s.gain.value = send; g.connect(s); s.connect(A.echo); }
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, type, at, bus, q) {
    const c = A.ctx, t = (at || c.currentTime), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = A.noiseBuf; s.loop = true;
    f.type = type || 'lowpass'; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || A.sfxBus);
    s.start(t, Math.random() * 0.8); s.stop(t + dur + 0.03);
  }
  const now = () => A.ctx.currentTime;
  function arp(type, freqs, step, dur, vol, send) { const t = now(); freqs.forEach((f, i) => tone(type, f, f, dur, vol, t + i * step, null, send)); }

  // ---------- 音效表 ----------
  const SFX = {
    shoot() { tone('square', 900, 300, 0.07, 0.26); noise(0.035, 0.3, 5000, 2000, 'highpass'); tone('sine', 180, 80, 0.06, 0.3); },
    smg() { tone('square', 1150, 520, 0.04, 0.17); noise(0.025, 0.22, 6000, 3000, 'highpass'); },
    shotgun() { noise(0.24, 0.75, 3400, 300); tone('sine', 150, 42, 0.2, 0.6); noise(0.05, 0.4, 7000, 4000, 'highpass'); },
    laser() { tone('sawtooth', 1320, 1250, 0.08, 0.07); tone('sine', 660, 640, 0.08, 0.1); },
    bounce() { tone('sine', 420, 980, 0.11, 0.3, 0, null, 0.3); tone('triangle', 840, 1960, 0.08, 0.12); },
    slash() { noise(0.13, 0.5, 2200, 7500, 'bandpass', 0, null, 1.5); tone('triangle', 900, 260, 0.1, 0.16); },
    launch() { tone('sine', 210, 62, 0.22, 0.6); noise(0.16, 0.4, 900, 200); },
    seeker() { tone('triangle', 640, 1400, 0.09, 0.2, 0, null, 0.3); tone('triangle', 960, 2000, 0.08, 0.12, now() + 0.05, null, 0.3); },
    hit() { tone('triangle', 240, 110, 0.05, 0.2); noise(0.03, 0.16, 3000, 1200, 'bandpass'); },
    kill() { tone('square', 540, 70, 0.17, 0.22); noise(0.14, 0.3, 2600, 400); tone('sine', 900, 1500, 0.06, 0.14, now() + 0.04, null, 0.4); },
    boom() { noise(0.55, 0.9, 1500, 90); tone('sine', 115, 28, 0.5, 0.75); noise(0.08, 0.5, 6000, 2500, 'highpass'); },
    hurt() { tone('sawtooth', 270, 55, 0.26, 0.42); noise(0.14, 0.4, 1200, 300); tone('square', 110, 70, 0.2, 0.2); },
    dash() { noise(0.2, 0.42, 900, 5200, 'bandpass', 0, null, 1.2); tone('sine', 300, 700, 0.12, 0.08); },
    coin() { const t = now(); tone('square', 988, 988, 0.05, 0.11, t); tone('square', 1319, 1319, 0.12, 0.11, t + 0.05, null, 0.25); },
    orb() { tone('sine', 620, 1040, 0.12, 0.2, 0, null, 0.35); tone('sine', 1240, 1560, 0.08, 0.08); },
    pick() { arp('triangle', [523, 659, 784], 0.05, 0.16, 0.24, 0.4); },
    lock() { tone('sawtooth', 120, 52, 0.35, 0.34); noise(0.08, 0.5, 2400, 600, 'bandpass', 0, null, 3); tone('square', 196, 185, 0.3, 0.1, now() + 0.06, null, 0.4); },
    clear() { arp('triangle', [523, 659, 784, 1047], 0.075, 0.3, 0.24, 0.5); tone('sine', 262, 262, 0.5, 0.16); },
    perk() { arp('triangle', [440, 554, 659, 880, 1109], 0.065, 0.5, 0.22, 0.6); tone('sine', 220, 220, 0.8, 0.18, 0, null, 0.4); },
    phase() { noise(0.7, 0.6, 200, 2600, 'bandpass', 0, null, 1); tone('sawtooth', 55, 230, 0.6, 0.4); tone('sine', 46, 40, 0.8, 0.5); },
    empty() { const t = now(); tone('square', 170, 150, 0.04, 0.16, t); tone('square', 130, 110, 0.05, 0.16, t + 0.07); },
    ui() { tone('sine', 880, 1180, 0.06, 0.16); tone('triangle', 1760, 1760, 0.03, 0.05); },
    eshoot() { tone('triangle', 430, 210, 0.07, 0.08); },
    portal() { tone('sine', 220, 880, 0.7, 0.2, 0, null, 0.6); noise(0.7, 0.2, 600, 5000, 'bandpass', 0, null, 2); },
    death() { const t = now(); [392, 349, 294, 220, 147].forEach((f, i) => tone('triangle', f, f * 0.97, 0.5, 0.26, t + i * 0.2, null, 0.6)); tone('sine', 73, 55, 1.6, 0.4, t + 0.8); },
    win() { const t = now(); [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, i === 6 ? 1.2 : 0.22, 0.26, t + i * 0.13, null, 0.6)); [262, 330, 392].forEach(f => tone('sine', f, f, 1.8, 0.14, t + 0.78, null, 0.4)); }
  };
  const FIXED = { coin: 1, pick: 1, clear: 1, perk: 1, death: 1, win: 1, ui: 1, portal: 1 };
  G.sfx = function (name) {
    if (!A.ctx || A._muted || A.ctx.state !== 'running') return;
    const t = A.ctx.currentTime;
    if (t - (A.last[name] || -1) < 0.045) return;
    A.last[name] = t;
    const f = SFX[name];
    if (!f) return;
    pm = FIXED[name] ? 1 : 0.94 + Math.random() * 0.12;
    f();
    pm = 1;
  };

  // ---------- 生成式背景音乐 ----------
  // 四小节和弦循环（相对根音的半音）：i - VI - III - VII
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]];
  const PENTA = [0, 3, 5, 7, 10, 12, 15];
  const ROOTS = [57, 62, 54]; // 三层各自的调：A、D、升F
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let step = 0, nextT = 0, seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

  function mode() {
    const g = G.game;
    if (!g || g.state === 'menu') return 'menu';
    if (g.state === 'dead' || g.state === 'win') return 'end';
    if (g.boss) return 'boss';
    if (g.active) return 'combat';
    return 'explore';
  }
  function pad(t, root, ch, dur, vol) {
    const c = A.ctx, f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'lowpass'; f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(900, t + dur * 0.5); f.frequency.linearRampToValueAtTime(380, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur * 1.08);
    f.connect(g); g.connect(A.musBus);
    const s = c.createGain(); s.gain.value = 0.5; g.connect(s); s.connect(A.echo);
    for (const n of ch) for (const det of [-7, 7]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(root + n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur * 1.1);
    }
  }
  const mt = (type, m, dur, vol, t, send) => tone(type, hz(m), hz(m), dur, vol, t, A.musBus, send);

  function playStep(t, md, s) {
    const g = G.game, fl = md === 'menu' ? 0 : Math.min(g.floor, 3) - 1, root = ROOTS[fl];
    const bar = Math.floor(s / 16) % 4, k = s % 16, ch = CHORDS[bar];
    const spb = md === 'boss' ? 0.119 : md === 'combat' ? 0.142 : md === 'menu' ? 0.2 : 0.165;
    if (k === 0) { pad(t, root - 12, ch, spb * 16, md === 'boss' ? 0.05 : 0.075); seed = 11 + bar * 97 + fl * 13 + (Math.floor(s / 64) % 3) * 31; }
    if (md === 'end') return spb;
    // 低音
    const bass = root - 24 + ch[0] + (ch[0] < -2 ? 12 : 0);
    if (md === 'boss') { if (k % 2 === 0) mt('sawtooth', bass + (k % 8 === 6 ? 12 : 0), spb * 1.6, 0.2, t); }
    else if (md === 'combat') { if (k % 4 === 0 || k === 10) mt('triangle', bass + 12, spb * 2.6, 0.34, t); }
    else if (k === 0 || k === 10) mt('sine', bass + 12, spb * 5, 0.36, t);
    // 琶音 / 旋律
    const dens = md === 'boss' ? 0.8 : md === 'combat' ? 0.62 : md === 'menu' ? 0.3 : 0.4;
    if ((k % 2 === 0 || md === 'boss' || md === 'combat') && rnd() < dens) {
      const fromChord = rnd() < 0.65;
      const n = fromChord ? ch[Math.floor(rnd() * 3)] + (rnd() < 0.5 ? 12 : 0) : PENTA[Math.floor(rnd() * PENTA.length)];
      const oct = fl === 1 ? 24 : 12;
      mt(fl === 2 ? 'square' : 'triangle', root + oct + n, spb * (md === 'explore' || md === 'menu' ? 3.2 : 1.5), fl === 2 ? 0.07 : 0.15, t, 0.7);
      if (fl === 1 && rnd() < 0.4) mt('sine', root + 36 + n, spb * 4, 0.06, t + spb * 0.5, 0.9);
    }
    // 鼓
    if (md === 'combat' || md === 'boss') {
      if (k % 4 === 0) { tone('sine', 130, 38, 0.16, 0.6, t, A.musBus); }
      if (k % 4 === 2) noise(0.03, md === 'boss' ? 0.16 : 0.1, 8000, 6000, 'highpass', t, A.musBus);
      if (md === 'boss') {
        if (k % 8 === 4) { noise(0.13, 0.3, 2600, 900, 'bandpass', t, A.musBus, 0.9); tone('triangle', 210, 140, 0.08, 0.2, t, A.musBus); }
        if (k === 14 || k === 15) noise(0.03, 0.12, 9000, 7000, 'highpass', t, A.musBus);
      }
    } else if (md === 'explore' && k === 8 && bar % 2 === 1) noise(0.5, 0.035, 500, 3000, 'bandpass', t, A.musBus, 2);
    return spb;
  }

  function schedule() {
    const c = A.ctx;
    if (!c || c.state !== 'running' || !A.musicOn) { nextT = 0; return; }
    if (nextT < c.currentTime) nextT = c.currentTime + 0.05;
    let guard = 0;
    while (nextT < c.currentTime + 0.22 && guard++ < 8) {
      const md = mode();
      nextT += playStep(nextT, md, step);
      step++;
    }
  }
})();

</script>
<script>
// 触屏操作：左侧虚拟摇杆移动，右侧摇杆瞄准并射击，按钮负责闪避 / 互动 / 换枪 / 暂停
'use strict';
(function () {
  const G = window.G, TAU = Math.PI * 2;
  const T = G.touch = {
    on: !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches),
    move: null, aim: null, aimAng: 0, mvx: 0, mvy: 0
  };
  const BTN = {
    dash: { x: 690, y: 540, r: 36 },
    use: { x: 690, y: 450, r: 30 },
    pause: { x: 764, y: 34, r: 19 }
  };
  const inBtn = (b, x, y) => Math.hypot(x - b.x, y - b.y) <= b.r + 8;
  const inWeapons = (x, y) => x > 750 && y > 478;

  G.initTouch = function (canvas) {
    const I = G.input;
    const pos = t => {
      const r = canvas.getBoundingClientRect();
      return { x: (t.clientX - r.left) / r.width * G.W, y: (t.clientY - r.top) / r.height * G.H };
    };
    const start = e => {
      e.preventDefault();
      G.audio.unlock();
      for (const t of e.changedTouches) {
        const p = pos(t), g = G.game;
        if (g.state !== 'play') { I.mx = p.x; I.my = p.y; I.clicked = true; continue; }
        // 选了电脑端却在触屏上玩：把触摸当作鼠标
        if (!T.on) { I.mx = p.x; I.my = p.y; I.down = true; continue; }
        if (inBtn(BTN.pause, p.x, p.y)) I.pressed.Escape = true;
        else if (inBtn(BTN.dash, p.x, p.y)) I.pressed.Space = true;
        else if (g.player.near && inBtn(BTN.use, p.x, p.y)) I.pressed.KeyE = true;
        else if (inWeapons(p.x, p.y)) I.pressed.KeyQ = true;
        else if (p.x < G.W * 0.45 && !T.move) T.move = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
        else if (p.x >= G.W * 0.45 && !T.aim) T.aim = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
      }
    };
    const move = e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const p = pos(t);
        if (T.move && t.identifier === T.move.id) { T.move.x = p.x; T.move.y = p.y; }
        else if (T.aim && t.identifier === T.aim.id) { T.aim.x = p.x; T.aim.y = p.y; }
        else if (G.game.state !== 'play' || !T.on) { I.mx = p.x; I.my = p.y; }
      }
    };
    const end = e => {
      e.preventDefault();
      if (!T.on) I.down = false;
      for (const t of e.changedTouches) {
        if (T.move && t.identifier === T.move.id) T.move = null;
        if (T.aim && t.identifier === T.aim.id) { T.aim = null; I.down = false; }
      }
    };
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end, { passive: false });
    canvas.addEventListener('touchcancel', end, { passive: false });
  };

  // 每帧把摇杆状态换算成移动向量和准星位置
  G.updateTouch = function () {
    const g = G.game, I = G.input;
    T.mvx = T.mvy = 0;
    if (!T.on) return;
    if (g.state !== 'play') { T.move = T.aim = null; return; }
    const p = g.player;
    if (T.move) {
      const dx = T.move.x - T.move.ox, dy = T.move.y - T.move.oy, d = Math.hypot(dx, dy);
      if (d > 8) { const k = Math.min(1, d / 46); T.mvx = dx / d * k; T.mvy = dy / d * k; }
    }
    if (!T.mvx && !T.mvy && (G.motion.mvx || G.motion.mvy)) { T.mvx = G.motion.mvx; T.mvy = G.motion.mvy; }
    if (T.aim) {
      const dx = T.aim.x - T.aim.ox, dy = T.aim.y - T.aim.oy, d = Math.hypot(dx, dy);
      if (d > 12) T.aimAng = Math.atan2(dy, dx);
      else {
        // 只按住不拖动：自动瞄准最近的敌人
        let best = null, bd = 460;
        for (const e of g.enemies) { if (e.spawnT > 0) continue; const ed = Math.hypot(e.x - p.x, e.y - p.y); if (ed < bd) { bd = ed; best = e; } }
        if (best) T.aimAng = Math.atan2(best.y - p.y, best.x - p.x);
      }
      I.down = true;
    } else if (T.mvx || T.mvy) T.aimAng = Math.atan2(T.mvy, T.mvx);

  const G = window.G;

    if (!M.on || M.status !== 'ok' || G.game.state !== 'play') return;

    ok: '体感操控：开 · 倾斜移动 · 甩动闪避',

<script>
// 地牢：随机房间布局、瓦片地图、碰撞、房间锁门与波次
'use strict';
(function () {
  const G = window.G;
  const T = G.T = { VOID: 0, FLOOR: 1, WALL: 2, DOOR: 3, BLOCK: 4 };
  const CW = 28, CH = 22, GN = 5;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const SIZE = { start: [11, 9], chest: [9, 7], shop: [13, 7], boss: [21, 15] };
  G.GRID_N = GN;

  G.genDungeon = function (floor) {
    const w = CW * GN, h = CH * GN;
    const tiles = new Uint8Array(w * h);
    const owner = new Int16Array(w * h).fill(-1);
    const grid = {}, rooms = [];
    const key = (x, y) => x + ',' + y;
    const inb = (x, y) => x >= 0 && y >= 0 && x < GN && y < GN;
    const link = (a, b) => { a.links.push(b.id); b.links.push(a.id); };
    function add(gx, gy, parent) {
      const r = {
        id: rooms.length, gx, gy, type: 'combat', links: [],
        visited: false, seen: false, cleared: false, locked: false, wave: 0, waves: 0
      };
      rooms.push(r); grid[key(gx, gy)] = r;
      if (parent) link(parent, r);
      return r;
    }

    // 1. 随机生长出房间树
    const start = add(2, 2, null);
    start.type = 'start';
    const n = 6 + floor;
    let guard = 0;
    while (rooms.length < n && guard++ < 4000) {
      const r = G.pick(rooms);
      if (r.links.length >= 3) continue;
      const d = G.pick(DIRS), gx = r.gx + d[0], gy = r.gy + d[1];
      if (!inb(gx, gy) || grid[key(gx, gy)]) continue;
      add(gx, gy, r);
    }

    // 2. Boss 房挂在离起点最远的房间外侧
    const dist = new Array(rooms.length).fill(-1);
    dist[0] = 0;
    const q = [0];
    while (q.length) {
      const i = q.shift();
      for (const j of rooms[i].links) if (dist[j] < 0) { dist[j] = dist[i] + 1; q.push(j); }
    }
    const order = rooms.slice(1).sort((a, b) => dist[b.id] - dist[a.id]);
    let boss = null;
    for (const r of order) {
      for (const d of G.shuffle(DIRS.slice())) {
        const gx = r.gx + d[0], gy = r.gy + d[1];
        if (inb(gx, gy) && !grid[key(gx, gy)]) { boss = add(gx, gy, r); break; }
      }
      if (boss) break;
    }
    if (!boss) boss = order[0];
    boss.type = 'boss';

    // 3. 少量额外连接形成回路
    for (const a of rooms) {
      for (const d of [[1, 0], [0, 1]]) {
        const b = grid[key(a.gx + d[0], a.gy + d[1])];
        if (!b || a === boss || b === boss || a.links.indexOf(b.id) >= 0) continue;
        if (Math.random() < 0.22) link(a, b);
      }
    }

    // 4. 分配宝箱房与商店（优先死胡同）
    const cand = G.shuffle(rooms.filter(r => r.type === 'combat')).sort((a, b) => a.links.length - b.links.length);
    if (cand[0]) cand[0].type = 'chest';
    if (cand[1]) cand[1].type = 'shop';

    // 5. 确定尺寸并铺地板
    for (const r of rooms) {
      let sz = SIZE[r.type];
      if (!sz) sz = [G.pick([13, 15, 17, 19]), G.pick([9, 11, 13])];
      r.w = sz[0]; r.h = sz[1];
      r.ctx = r.gx * CW + 14; r.cty = r.gy * CH + 11;
      r.x = r.ctx - (r.w - 1) / 2; r.y = r.cty - (r.h - 1) / 2;
      r.cx = (r.ctx + 0.5) * G.TILE; r.cy = (r.cty + 0.5) * G.TILE;
      if (r.type === 'combat') r.waves = Math.random() < 0.35 + floor * 0.15 ? 2 : 1;
      if (r.type === 'start') { r.cleared = true; }
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) tiles[y * w + x] = T.FLOOR;
    }

    // 6. 走廊与门
    const setDoor = (x, y, r) => { tiles[y * w + x] = T.DOOR; owner[y * w + x] = r.id; };
    for (const a of rooms) {
      for (const j of a.links) {
        const b = rooms[j];
        if (b.id < a.id) continue;
        if (a.gy === b.gy) {
          const L = a.gx < b.gx ? a : b, R = a.gx < b.gx ? b : a;
          for (let dy = -1; dy <= 1; dy++) {
            const y = L.cty + dy;
            for (let x = L.x + L.w; x <= R.x - 1; x++) tiles[y * w + x] = T.FLOOR;
            setDoor(L.x + L.w, y, L); setDoor(R.x - 1, y, R);
          }
        } else {
          const U = a.gy < b.gy ? a : b, D = a.gy < b.gy ? b : a;
          for (let dx = -1; dx <= 1; dx++) {
            const x = U.ctx + dx;
            for (let y = U.y + U.h; y <= D.y - 1; y++) tiles[y * w + x] = T.FLOOR;
            setDoor(x, U.y + U.h, U); setDoor(x, D.y - 1, D);
          }
        }
      }
    }

    // 7. 墙壁：包住所有可走区域
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (tiles[y * w + x] !== T.VOID) continue;
        let near = false;
        for (let oy = -1; oy <= 1 && !near; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            const nx = x + ox, ny = y + oy;

          }
        }
        if (near) tiles[y * w + x] = T.WALL;
      }
    }

    // 8. 战斗房内的掩体（左右对称，避开门的轴线）
    for (const r of rooms) {
      if (r.type !== 'combat') continue;
      const cnt = G.randi(1, 3);
      for (let i = 0; i < cnt; i++) {
        const bx = G.randi(r.x + 2, r.ctx - 3), by = G.randi(r.y + 2, r.y + r.h - 3);

    const S = G.TILE;
    const x0 = Math.floor((x - r) / S), x1 = Math.floor((x + r) / S);

    return false;
  };
  // 分轴移动，返回是否撞墙
  G.moveEntity = function (e, dx, dy) {
    let hit = false;
    if (dx) { e.x += dx; if (G.collides(e.x, e.y, e.r)) { e.x -= dx; hit = true; } }
    if (dy) { e.y += dy; if (G.collides(e.x, e.y, e.r)) { e.y -= dy; hit = true; } }
    return hit;
  };
  G.raycast = function (x, y, ang, max) {
    const dx = Math.cos(ang) * 6, dy = Math.sin(ang) * 6;
    let d = 0;
    while (d < max && !G.pointSolid(x + dx, y + dy)) { x += dx; y += dy; d += 6; }
    return { x, y, d };
  };
  G.roomAt = function (x, y, margin) {
    const S = G.TILE, rooms = G.game.dungeon.rooms;
    for (const r of rooms) {
      if (x >= r.x * S + margin && x <= (r.x + r.w) * S - margin && y >= r.y * S + margin && y <= (r.y + r.h) * S - margin) return r;
    }
    return null;
  };
  G.randomSpot = function (room, minDist) {
    const g = G.game, p = g.player, S = G.TILE;
    for (let i = 0; i < 60; i++) {
      const tx = G.randi(room.x + 1, room.x + room.w - 2), ty = G.randi(room.y + 1, room.y + room.h - 2);
      if (G.tileSolid(tx, ty)) continue;
      const x = (tx + 0.5) * S, y = (ty + 0.5) * S;
      if (Math.hypot(x - p.x, y - p.y) >= minDist) return { x, y };
    }

  };

  // ---------- 房间流程 ----------
  const POOLS = [
    ['lunger', 'lunger', 'wick', 'wick', 'fuse', 'spore', 'mite'],
    ['lunger', 'wick', 'fuse', 'spore', 'brood', 'gazer', 'mite'],
    ['lunger', 'wick', 'fuse', 'spore', 'spore', 'brood', 'gazer', 'gazer']
  ];
  G.spawnWave = function (room) {
    const g = G.game, floor = g.floor;
    room.wave++;
    let budget = 6 + floor * 3 + G.randi(0, 3) + (room.wave - 1) * 2;
    const pool = POOLS[Math.min(floor, 3) - 1];
    let guard = 0;
    while (budget > 0 && guard++ < 60) {
      const type = G.pick(pool), def = G.ENEMIES[type];
      if (def.cost > budget) continue;
      const cnt = type === 'mite' ? 3 : 1;
      budget -= def.cost * cnt;
      for (let i = 0; i < cnt; i++) {
        const s = G.randomSpot(room, 150);
        G.spawnEnemy(type, s.x, s.y, 0.7 + Math.random() * 0.5);
      }
    }
  };

  function clearRoom(room) {
    const g = G.game;
    room.cleared = true; room.locked = false; g.active = null;
    G.sfx('clear');
    g.banner = { text: '区域已肃清', t: 1.6, small: true };
    const n = G.randi(2, 4);
    for (let i = 0; i < n; i++) G.dropPickup('energy', room.cx + G.rand(-40, 40), room.cy + G.rand(-40, 40), 12);

  G.updateRooms = function () {
    const g = G.game, p = g.player, d = g.dungeon;
    const r = G.roomAt(p.x, p.y, 14);

        r.visited = true; r.seen = true;

      }

      }
    }

    if (a && a.type === 'combat' && g.enemies.length === 0) {
      if (a.wave < a.waves) G.spawnWave(a); else clearRoom(a);
    }
  };
})();

          x.fillStyle = G.shade(th.wall, -0.15);
          if (walk(at2(tx - 1, ty))) x.fillRect(px, py, 3, S);
          if (walk(at2(tx + 1, ty))) x.fillRect(px + S - 3, py, 3, S);
          if (walk(at2(tx, ty - 1))) x.fillRect(px, py, S, 4);
          if (at2(tx, ty + 1) === T.WALL && (walk(at2(tx, ty + 2)) || at2(tx, ty + 2) === T.BLOCK)) { x.fillStyle = 'rgba(0,0,0,0.3)'; x.fillRect(px, py + S - 4, S, 4); }
        }
      } else if (t === T.BLOCK) x.drawImage(at, 0, S * 2, S, S, px, py, S, S);
    }
    return c;
  }

  // 每帧在后台烘焙一个分块，避免走到新区域时卡顿
  G.prebake = function (d) {
    if (!d.bakeQ) {
      d.bakeQ = [];
      const st = d.start;
      for (let cy = 0; cy < Math.ceil(d.h / CHUNK); cy++) for (let cx = 0; cx < Math.ceil(d.w / CHUNK); cx++) {
        let any = false;
        for (let ty = cy * CHUNK; ty < Math.min(d.h, (cy + 1) * CHUNK) && !any; ty++) for (let tx = cx * CHUNK; tx < Math.min(d.w, (cx + 1) * CHUNK); tx++) if (d.tiles[ty * d.w + tx] !== T.VOID) { any = true; break; }
        if (any) d.bakeQ.push([cx, cy, Math.hypot((cx + 0.5) * CHUNK - st.ctx, (cy + 0.5) * CHUNK - st.cty)]); else d.chunks[cx + ',' + cy] = EMPTY;
      }
      d.bakeQ.sort((a, b) => b[2] - a[2]);
    }
    while (d.bakeQ.length) {
      const q = d.bakeQ.pop(), key = q[0] + ',' + q[1];
      if (d.chunks[key]) continue;
      d.chunks[key] = bakeChunk(d, q[0], q[1]);
      break;
    }
  };
  const EMPTY = {};
  // 换层时（黑屏转场下）先把出生点周围的分块烘焙好
  G.prebakeNear = function (d, x, y) {
    G.prebake(d);
    const cx = Math.floor(x / CPX), cy = Math.floor(y / CPX);
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const key = (cx + ox) + ',' + (cy + oy);
      if (!d.chunks[key] && cx + ox >= 0 && cy + oy >= 0) d.chunks[key] = bakeChunk(d, cx + ox, cy + oy);
    }
  };
  // 在主菜单期间分帧预热：三套瓦片图集、常用光晕贴图、光照画布
  let warmStep = 0;
  G.warm = function (ctx) {
    if (warmStep > 5) return;
    if (warmStep < 3) atlas(warmStep);
    else if (warmStep === 3) { for (const c of ['#ff9a3c', '#ffcf3e', '#6fe0ff', '#5dff8a', '#ffd27a', '#ffd86b']) G.glowSprite(c); for (const k in G.ENEMIES) G.glowSprite(G.ENEMIES[k].color); }
    else if (warmStep === 4) { for (const k in G.WEAPONS) G.glowSprite(G.WEAPONS[k].color); for (const r of [5, 6, 8]) for (const c of ['#ff5d5d', '#ffb84a', '#a4ff7a', '#8af4ff']) G.bulletSprite(c, r); }
    else { ctx.save(); ctx.globalAlpha = 0.01; for (const f of [G.FONT, G.FONT_T]) for (const b of ['', 'bold ']) { ctx.font = b + '14px ' + f; ctx.fillText('0123456789层击杀', -200, -200); } ctx.restore(); }
    warmStep++;
  };

  G.drawMap = function (ctx, g) {
    const d = g.dungeon, cam = g.cam;
    const cx0 = Math.max(0, Math.floor(cam.x / CPX)), cx1 = Math.min(Math.ceil(d.w / CHUNK) - 1, Math.floor((cam.x + G.W) / CPX));
    const cy0 = Math.max(0, Math.floor(cam.y / CPX)), cy1 = Math.min(Math.ceil(d.h / CHUNK) - 1, Math.floor((cam.y + G.H) / CPX));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const key = cx + ',' + cy;
      const c = d.chunks[key] || (d.chunks[key] = bakeChunk(d, cx, cy));
      if (c !== EMPTY) ctx.drawImage(c, cx * CPX, cy * CPX);
    }
  };

  // 锁住的门：两侧立柱 + 能量屏障
  G.drawDoors = function (ctx, g, th) {
    const d = g.dungeon, cam = g.cam;
    for (const dr of d.doors) {
      const r = d.rooms[dr.owner];
      if (!r.locked) continue;
      const px = dr.tx * S, py = dr.ty * S;
      if (px < cam.x - S || px > cam.x + G.W || py < cam.y - S || py > cam.y + G.H) continue;
      ctx.fillStyle = '#120e14'; ctx.fillRect(px, py, S, S);
      ctx.fillStyle = G.rgba(th.accent, 0.16 + Math.sin(g.time * 7 + dr.tx + dr.ty) * 0.06); ctx.fillRect(px, py, S, S);
      const vert = d.tiles[dr.ty * d.w + dr.tx - 1] === T.DOOR || d.tiles[dr.ty * d.w + dr.tx + 1] === T.DOOR;
      for (let i = 0; i < 3; i++) {
        const o = 5 + i * 11, fl = 0.75 + Math.sin(g.time * 14 + i * 2 + dr.tx) * 0.25;
        ctx.fillStyle = G.rgba(th.accent, fl);
        if (vert) ctx.fillRect(px + o - 2, py + 2, 4, S - 4); else ctx.fillRect(px + 2, py + o - 2, S - 4, 4);
        ctx.fillStyle = '#fff';
        if (vert) ctx.fillRect(px + o - 0.5, py + 3, 1.5, S - 6); else ctx.fillRect(px + 3, py + o - 0.5, S - 6, 1.5);
      }
      ctx.fillStyle = '#3a323c';
      if (vert) { ctx.fillRect(px, py, S, 3); ctx.fillRect(px, py + S - 3, S, 3); } else { ctx.fillRect(px, py, 3, S); ctx.fillRect(px + S - 3, py, 3, S); }
    }
  };

  G.drawTorches = function (ctx, g, lit) {
    const d = g.dungeon, cam = g.cam;
    for (const t of d.torches) {
      if (t.x < cam.x - 60 || t.x > cam.x + G.W + 60 || t.y < cam.y - 60 || t.y > cam.y + G.H + 60) continue;
      const f = Math.sin(g.time * 11 + t.ph) * 0.5 + Math.sin(g.time * 23 + t.ph * 2) * 0.5;
      if (!lit) {
        if (t.brazier) {
          ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(t.x, t.y + 9, 12, 4, 0, 0, TAU); ctx.fill();
          ctx.fillStyle = '#2a2428'; ctx.fillRect(t.x - 2, t.y, 4, 9);
          ctx.fillStyle = '#4a4248'; ctx.beginPath(); ctx.moveTo(t.x - 11, t.y - 6); ctx.lineTo(t.x + 11, t.y - 6); ctx.lineTo(t.x + 6, t.y + 2); ctx.lineTo(t.x - 6, t.y + 2); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#6a6068'; ctx.fillRect(t.x - 11, t.y - 7, 22, 2);
        } else {
          ctx.fillStyle = '#231d1d'; ctx.fillRect(t.x - 1.5, t.y - 1, 3, 9);
          ctx.fillStyle = '#4a4040'; ctx.fillRect(t.x - 4, t.y - 3, 8, 3);
        }
        continue;
      }
      const fy = t.y - (t.brazier ? 8 : 5), s = t.brazier ? 1.5 : 1;
      G.glow(ctx, '#ff9a3c', t.x, fy, (t.brazier ? 60 : 44) + f * 5, 0.5);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ff8a2a';
      ctx.beginPath(); ctx.moveTo(t.x - 4 * s, fy + 2); ctx.quadraticCurveTo(t.x - 5 * s, fy - 5 * s, t.x + f * 1.5, fy - (10 + f * 2) * s); ctx.quadraticCurveTo(t.x + 5 * s, fy - 5 * s, t.x + 4 * s, fy + 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff0b0';
      ctx.beginPath(); ctx.ellipse(t.x, fy - 1, 1.8 * s, 3.4 * s, 0, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
    }
  };

  // ---------- 光照：半分辨率暗幕上挖出光斑 ----------
  let lightC = null, lightX = null, mask = null;
  const masks = {};
  G.drawLighting = function (ctx, g, th) {
    if (!lightC) {
      lightC = mk(G.W / 2, G.H / 2); lightX = lightC.getContext('2d');
      mask = mk(128, 128);
      const mx = mask.getContext('2d'), gr = mx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      mx.fillStyle = gr; mx.fillRect(0, 0, 128, 128);
    }
    const x = lightX, cam = g.cam, p = g.player, d = g.dungeon;
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
    x.clearRect(0, 0, G.W / 2, G.H / 2);
    x.fillStyle = 'rgba(' + th.dark + ',0.74)'; x.fillRect(0, 0, G.W / 2, G.H / 2);
    x.globalCompositeOperation = 'destination-out';
    const add = (wx, wy, r, a) => {
      const sx = (wx - cam.x) / 2, sy = (wy - cam.y) / 2, rr = r / 2;
      if (sx < -rr || sy < -rr || sx > G.W / 2 + rr || sy > G.H / 2 + rr) return;
      const q = Math.max(16, Math.round(r / 12) * 12);
      let m = masks[q];
      if (!m) { m = masks[q] = mk(q, q); m.getContext('2d').drawImage(mask, 0, 0, q, q); }
      x.globalAlpha = a; x.drawImage(m, Math.round(sx - q / 2), Math.round(sy - q / 2));
    };
    // 当前房间整体提亮，突出战斗区域
    const rm = G.roomAt(p.x, p.y, 0);
    if (rm) { x.globalAlpha = 0.6; x.fillStyle = '#fff'; x.fillRect((rm.x * S - cam.x - S) / 2, (rm.y * S - cam.y - S) / 2, (rm.w + 2) * S / 2, (rm.h + 2) * S / 2); }
    add(p.x, p.y, 330, 1);
    for (const t of d.torches) add(t.x, t.y + 8, (t.brazier ? 250 : 190) + Math.sin(g.time * 11 + t.ph) * 10, 0.85);
    for (const it of g.items) add(it.x, it.y, it.kind === 'portal' ? 220 : 110, 0.7);
    for (const b of g.bullets) add(b.x, b.y, 70, 0.5);
    const eb = g.ebullets, step = eb.length > 300 ? 3 : eb.length > 120 ? 2 : 1;
    for (let i = 0; i < eb.length; i += step) add(eb[i].x, eb[i].y, 54, 0.45);
    for (const e of g.enemies) if (e.def.boss) add(e.x, e.y, 260, 0.8);
    for (const e of g.effects) if (e.type === 'boom') add(e.x, e.y, e.rad * 3.2, 1 - e.t / e.dur);
    if (p.beam) { const b = p.beam; for (let k = 0; k <= 1; k += 0.125) add(b.x1 + (b.x2 - b.x1) * k, b.y1 + (b.y2 - b.y1) * k, 90, 0.5); }
    ctx.drawImage(lightC, 0, 0, G.W, G.H);
  };

  // 漂浮的尘埃 / 余烬（屏幕空间，带视差）
  G.drawMotes = function (ctx, g, th) {
    const t = g.time;
    ctx.fillStyle = th.mote;
    for (let i = 0; i < 40; i++) {
      const par = 0.3 + (i % 5) * 0.12;
      const x = (((i * 211.7 + Math.sin(t * 0.4 + i) * 30 + t * (6 + i % 7) - g.cam.x * par) % G.W) + G.W) % G.W;
      const y = (((i * 97.3 - t * (10 + i % 9) - g.cam.y * par) % G.H) + G.H) % G.H;
      const s = 1.5 + (i % 3);
      ctx.globalAlpha = 0.14 + 0.2 * (0.5 + 0.5 * Math.sin(t * 2 + i * 1.7));
      ctx.fillRect(x, y, s, s);
    }
    ctx.globalAlpha = 1;
  };
  G.mkCanvas = mk;
})();

<script>
// 子弹、爆炸、粒子、飘字、掉落物
'use strict';
(function () {
  const G = window.G;
  const MAX_EB = 900, MAX_PART = 420, MAX_TEXT = 40;

  G.spawnBullet = function (o) {
    const g = G.game;
    const b = {
      x: o.x, y: o.y, vx: o.vx, vy: o.vy, r: o.r || 4, dmg: o.dmg || 1, crit: !!o.crit,
      life: o.life || 1.5, color: o.color || '#fff', bounce: o.bounce || 0, pierce: o.pierce || 0,
      homing: o.homing || 0, explode: o.explode || 0, lastHit: null
    };
    if (o.friendly) g.bullets.push(b);
    else if (g.ebullets.length < MAX_EB) g.ebullets.push(b);
    return b;
  };

  // 敌方射击的简写
  G.eshoot = function (x, y, ang, speed, dmg, o) {
    o = o || {};
    return G.spawnBullet({
      x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, dmg: dmg * G.game.dmgMul,
      r: o.r || 5, color: o.color || '#ff5d5d', life: o.life || 6, homing: o.homing || 0, friendly: false
    });
  };
  G.ering = function (x, y, n, speed, dmg, offset, o) {
    for (let i = 0; i < n; i++) G.eshoot(x, y, offset + i * Math.PI * 2 / n, speed, dmg, o);
  };

  function steer(b, tx, ty, rate, dt) {
    const sp = Math.hypot(b.vx, b.vy), cur = Math.atan2(b.vy, b.vx);
    const d = G.angDiff(Math.atan2(ty - b.y, tx - b.x), cur);
    const a = cur + G.clamp(d, -rate * dt, rate * dt);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
  }

  function stepList(list, dt, friendly) {
    const g = G.game, p = g.player, en = g.enemies;
    for (let i = list.length - 1; i >= 0; i--) {
      const b = list[i];
      b.life -= dt;
      let dead = b.life <= 0;
      if (!dead) {
        if (b.homing) {
          if (friendly) {
            let best = null, bd = 320 * 320;
            for (const e of en) {
              if (e.spawnT > 0) continue;
              const d2 = (e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y);
              if (d2 < bd) { bd = d2; best = e; }
            }
            if (best) steer(b, best.x, best.y, b.homing, dt);
          } else steer(b, p.x, p.y, b.homing, dt);
        }
        const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
        if (G.pointSolid(nx, ny)) {
          if (b.bounce > 0) {
            b.bounce--; b.lastHit = null;
            const sx = G.pointSolid(nx, b.y), sy = G.pointSolid(b.x, ny);
            if (sx) b.vx = -b.vx;
            if (sy) b.vy = -b.vy;
            if (!sx && !sy) { b.vx = -b.vx; b.vy = -b.vy; }
            G.burst(b.x, b.y, b.color, 3, 80, 0.25, 2);
            if (friendly) G.sfx('bounce');
          } else dead = true;
        } else { b.x = nx; b.y = ny; }
      }
      if (!dead) {
        if (friendly) {
          for (let k = 0; k < en.length; k++) {
            const e = en[k];
            if (e.spawnT > 0 || e.dead || b.lastHit === e) continue;
            const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
            if (dx * dx + dy * dy < rr * rr) {
              if (b.explode) { dead = true; break; }
              G.hurtEnemy(e, b.dmg, b.crit, b.vx * 0.25, b.vy * 0.25);
              b.lastHit = e;
              if (b.pierce > 0) b.pierce--; else { dead = true; break; }
            }
          }
        } else if (p.dashT <= 0) {
          const dx = p.x - b.x, dy = p.y - b.y, rr = p.r + b.r - 3;
          if (dx * dx + dy * dy < rr * rr) {
            if (p.invuln <= 0) G.hurtPlayer(b.dmg);
            dead = true;
          }
        }
      }
      if (dead) {
        if (b.explode) G.explode(b.x, b.y, b.explode, b.dmg, friendly, b.crit);
        else G.burst(b.x, b.y, b.color, 3, 70, 0.2, 2);
        list[i] = list[list.length - 1];
        list.pop();
      }
    }
  }
  G.updateBullets = function (dt) {
    stepList(G.game.bullets, dt, true);
    stepList(G.game.ebullets, dt, false);
  };

  G.explode = function (x, y, rad, dmg, friendly, crit) {
    const g = G.game, p = g.player;
    g.effects.push({ type: 'boom', x, y, rad, t: 0, dur: 0.32, color: friendly ? '#ffc56b' : '#ff6a4a' });
    G.burst(x, y, friendly ? '#ffd58a' : '#ff8a5a', 14, 220, 0.45, 3);
    g.effects.push({ type: 'ring', x, y, rad: rad * 1.5, t: 0, dur: 0.4, color: '#ffffff' });
    G.stain(x, y, rad * 0.5, '#050304', 0.4);
    g.shake = Math.max(g.shake, 7);
    G.sfx('boom');
    if (friendly) {
      for (const e of g.enemies.slice()) {
        if (e.spawnT > 0 || e.dead) continue;
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < rad + e.r) G.hurtEnemy(e, dmg, crit, (e.x - x) / (d || 1) * 160, (e.y - y) / (d || 1) * 160);
      }
    } else if (Math.hypot(p.x - x, p.y - y) < rad + p.r) G.hurtPlayer(dmg);
  };

  // ---------- 粒子与飘字 ----------
  G.burst = function (x, y, color, n, speed, life, size) {
    const ps = G.game.particles;
    for (let i = 0; i < n && ps.length < MAX_PART; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
      ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: size * (0.6 + Math.random() * 0.8) });
    }
  };
  // 带描边的三角碎片（敌人死亡时飞散）
  G.shards = function (x, y, color, n, speed) {
    const ps = G.game.particles;
    for (let i = 0; i < n && ps.length < MAX_PART; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65), life = 0.45 + Math.random() * 0.35;
      ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: 2.5 + Math.random() * 3.5, tri: true, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 18 });
    }
  };
  // 留在地面上的污渍 / 焦痕
  G.stain = function (x, y, r, color, a) {
    const st = G.game.stains;
    if (st.length >= 70) st.shift();
    st.push({ x, y, r, color, a, rot: Math.random() * 3.14 });
  };
  G.floatText = function (x, y, str, color, size) {
    const ts = G.game.texts;
    if (ts.length >= MAX_TEXT) ts.shift();
    ts.push({ x: x + G.rand(-6, 6), y, str, color: color || '#fff', size: size || 13, t: 0, dur: 0.7 });
  };
  G.updateFx = function (dt) {
    const g = G.game, ps = g.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const q = ps[i];
      q.life -= dt;
      if (q.life <= 0) { ps[i] = ps[ps.length - 1]; ps.pop(); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
      if (q.tri) q.rot += q.vr * dt;
    }
    for (let i = g.texts.length - 1; i >= 0; i--) {
      const t = g.texts[i];
      t.t += dt; t.y -= 34 * dt;
      if (t.t >= t.dur) g.texts.splice(i, 1);
    }
    for (let i = g.effects.length - 1; i >= 0; i--) {
      const e = g.effects[i];
      e.t += dt;
      if (e.t >= e.dur) g.effects.splice(i, 1);
    }
  };

  // ---------- 自动拾取的掉落物 ----------
  G.dropPickup = function (kind, x, y, val) {
    const a = Math.random() * Math.PI * 2, s = G.rand(60, 160);
    G.game.pickups.push({ kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, val, t: 0, r: 5 });
  };
  G.updatePickups = function (dt) {
    const g = G.game, p = g.player, list = g.pickups;
    const range = g.active ? 80 : 420;
    for (let i = list.length - 1; i >= 0; i--) {
      const k = list[i];
      k.t += dt;
      const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
      if (k.kind === 'health' && p.hp >= p.maxHp) { /* 满血时不吸附 */ }
      else if (k.t > 0.35 && d < range) {
        const pull = 900 * dt;
        k.vx += dx / d * pull; k.vy += dy / d * pull;
      }
      k.vx *= 0.9; k.vy *= 0.9;
      G.moveEntity(k, k.vx * dt, k.vy * dt);
      if (d < 18 && k.t > 0.2) {
        if (k.kind === 'coin') {
          const v = Math.max(1, Math.round(k.val * p.stats.goldMul));
          p.gold += v; g.goldTotal += v; G.sfx('coin');
        } else if (k.kind === 'energy') {
          p.energy = Math.min(p.maxEnergy, p.energy + k.val); G.sfx('orb');
        } else if (k.kind === 'health') {
          if (p.hp >= p.maxHp) continue;
          p.hp = Math.min(p.maxHp, p.hp + k.val); G.sfx('orb');
          G.floatText(p.x, p.y - 20, '+' + k.val, '#7dff9a');
        }
        list[i] = list[list.length - 1];
        list.pop();
      }
    }
  };

'use strict';
(function () {
  const G = window.G;

  G.WEAPONS = {
    pistol: { name: '火花手枪', desc: '不耗能量的可靠副手', cost: 0, cd: 0.26, dmg: 12, speed: 560, spread: 0.04, count: 1, color: '#ffd27a', sfx: 'shoot', len: 15, th: 5 },
    shotgun: { name: '碎岩霰弹', desc: '近距离一次喷出六枚弹丸', cost: 4, cd: 0.72, dmg: 9, speed: 520, spread: 0.55, count: 6, life: 0.42, color: '#ff9a5c', sfx: 'shotgun', len: 20, th: 7 },
    smg: { name: '蜂群速射', desc: '射速极快，弹道略散', cost: 1, cd: 0.075, dmg: 6, speed: 660, spread: 0.2, count: 1, color: '#fff27a', r: 3, sfx: 'smg', len: 18, th: 5 },
    laser: { name: '棱镜光束', desc: '持续照射并贯穿一排敌人', kind: 'beam', cost: 0.9, cd: 0.05, dmg: 4.5, color: '#7af0ff', sfx: 'laser', len: 21, th: 6 },
    bouncer: { name: '回响弹球', desc: '在墙壁间反弹四次', cost: 2, cd: 0.34, dmg: 14, speed: 430, spread: 0.03, count: 1, bounce: 4, r: 6, life: 3.2, color: '#9dff8a', sfx: 'bounce', len: 15, th: 8 },
    blade: { name: '烬刃', desc: '近身挥砍，可斩碎敌方子弹', kind: 'melee', cost: 0, cd: 0.36, dmg: 30, range: 74, arc: 2.3, color: '#ff7ad1', sfx: 'slash', len: 28, th: 4 },
    launcher: { name: '裂空榴弹', desc: '命中后范围爆炸', cost: 6, cd: 0.8, dmg: 36, speed: 380, spread: 0.02, count: 1, explode: 72, r: 7, life: 1.3, color: '#ffb347', sfx: 'launch', len: 20, th: 9 },
    seeker: { name: '追光弩', desc: '双发箭矢自动追踪目标', cost: 2, cd: 0.3, dmg: 10, speed: 360, spread: 0.5, count: 2, homing: 5, life: 2, color: '#c59bff', sfx: 'seeker', len: 19, th: 5 }
  };
  G.WEAPON_IDS = Object.keys(G.WEAPONS);

  G.fireWeapon = function (p) {
    const g = G.game, w = G.WEAPONS[p.weapons[p.cur]], s = p.stats;
    const cost = w.cost * s.costMul;
    if (p.energy < cost) {
      if (p.emptyT <= 0) { G.floatText(p.x, p.y - 22, '能量不足', '#ffcf6b'); G.sfx('empty'); p.emptyT = 0.8; }
      p.cd = 0.2;
      return;
    }
    p.energy -= cost;
    p.cd = w.cd / s.rate;
    p.recoil = 1; p.muzzle = 1;
    const ang = p.aim;
    const mx = p.x + Math.cos(ang) * 14, my = p.y + Math.sin(ang) * 14;
    const roll = () => {
      const c = Math.random() < s.crit;
      return { d: w.dmg * s.dmg * (c ? 2 : 1), c };
    };
    G.sfx(w.sfx);

    if (w.kind === 'beam') {
      const hit = G.raycast(mx, my, ang, 640);
      p.beam = { x1: mx, y1: my, x2: hit.x, y2: hit.y, t: 0.08 };
      for (const e of g.enemies.slice()) {
        if (e.spawnT > 0 || e.dead) continue;
        if (G.segDist(e.x, e.y, mx, my, hit.x, hit.y) < e.r + 5) { const r = roll(); G.hurtEnemy(e, r.d, r.c, 0, 0); }
      }
      if (Math.random() < 0.5) G.burst(hit.x, hit.y, w.color, 1, 90, 0.25, 2);
      return;
    }

    if (w.kind === 'melee') {
      g.effects.push({ type: 'slash', x: p.x, y: p.y, ang, range: w.range, arc: w.arc, t: 0, dur: 0.16, color: w.color });
      for (const e of g.enemies.slice()) {
        if (e.spawnT > 0 || e.dead) continue;
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < w.range + e.r && Math.abs(G.angDiff(Math.atan2(e.y - p.y, e.x - p.x), ang)) < w.arc / 2) {
          const r = roll();
          G.hurtEnemy(e, r.d, r.c, Math.cos(ang) * 260, Math.sin(ang) * 260);
        }
      }
      const eb = g.ebullets;
      for (let i = eb.length - 1; i >= 0; i--) {
        const b = eb[i], d = Math.hypot(b.x - p.x, b.y - p.y);
        if (d < w.range + 6 && Math.abs(G.angDiff(Math.atan2(b.y - p.y, b.x - p.x), ang)) < w.arc / 2) {
          G.burst(b.x, b.y, '#fff', 3, 90, 0.2, 2);
          eb[i] = eb[eb.length - 1]; eb.pop();
        }
      }
      return;
    }

    const n = w.count + s.multishot;
    for (let i = 0; i < n; i++) {
      let a;
      if (w.count > 1) a = ang + (Math.random() - 0.5) * w.spread;
      else a = ang + (n > 1 ? (i - (n - 1) / 2) * 0.13 : 0) + (Math.random() - 0.5) * w.spread;
      const sp = w.speed * s.bulletSpeed * (w.count > 2 ? G.rand(0.82, 1.1) : 1);
      const r = roll();
      G.spawnBullet({
        friendly: true, x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: w.r || 4, dmg: r.d, crit: r.c, life: w.life || 1.4, color: w.color,
        bounce: w.bounce || 0, pierce: s.pierce, homing: w.homing || 0, explode: w.explode || 0
      });
    }
    G.burst(mx + Math.cos(ang) * 8, my + Math.sin(ang) * 8, w.color, 2, 120, 0.12, 2);
  };

  // 以原点为握把、沿 +x 方向画出武器
  G.drawWeapon = function (ctx, id, scale) {
    const w = G.WEAPONS[id], L = w.len * scale, H = w.th * scale;
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#140e14'; ctx.lineWidth = 2.5;
    if (id !== 'blade') { ctx.strokeRect(0, -H / 2, L, H); ctx.strokeRect(1 * scale, 0, 4 * scale, H / 2 + 4 * scale); }
    else { ctx.beginPath(); ctx.moveTo(4 * scale, -H / 2); ctx.lineTo(L, 0); ctx.lineTo(4 * scale, H / 2); ctx.closePath(); ctx.stroke(); ctx.strokeRect(-3 * scale, -2.5 * scale, 7 * scale, 5 * scale); }
    ctx.fillStyle = '#343a46';
    if (id === 'blade') {
      ctx.fillRect(-3 * scale, -2.5 * scale, 7 * scale, 5 * scale);
      ctx.fillStyle = w.color;
      ctx.beginPath(); ctx.moveTo(4 * scale, -H / 2); ctx.lineTo(L, 0); ctx.lineTo(4 * scale, H / 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(4 * scale, -0.6 * scale, L * 0.6, 1.2 * scale);
      return;
    }
    ctx.fillRect(0, -H / 2, L, H);
    ctx.fillRect(1 * scale, 0, 4 * scale, H / 2 + 4 * scale);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, -H / 2, L, Math.max(1, scale));
    ctx.fillStyle = w.color;
    ctx.fillRect(L * 0.25, -H / 2 + scale, L * 0.5, Math.max(1, H * 0.3));
    if (id === 'shotgun') { ctx.fillStyle = '#0c0e12'; ctx.fillRect(L - 4 * scale, -0.5 * scale, 4 * scale, scale); }
    else if (id === 'smg') { ctx.fillStyle = '#20242c'; ctx.fillRect(L * 0.45, 0, 3 * scale, H / 2 + 5 * scale); }
    else if (id === 'laser') { ctx.fillRect(L - 2 * scale, -H / 2 - scale, 3 * scale, H + 2 * scale); }
    else if (id === 'bouncer') { ctx.beginPath(); ctx.arc(L, 0, H * 0.55, 0, Math.PI * 2); ctx.fill(); }
    else if (id === 'launcher') { ctx.fillStyle = '#0c0e12'; ctx.beginPath(); ctx.arc(L, 0, H * 0.4, 0, Math.PI * 2); ctx.fill(); }
    else if (id === 'seeker') {
      ctx.strokeStyle = w.color; ctx.lineWidth = 1.5 * scale;
      ctx.beginPath(); ctx.arc(L * 0.55, 0, L * 0.45, -1.1, 1.1); ctx.stroke();
    }
  };
})();

<script>
// 玩家：移动、闪避、三条资源、射击、互动
'use strict';
(function () {
  const G = window.G;

  G.createPlayer = function () {
    return {
      x: 0, y: 0, r: 11, aim: 0,
      hp: 100, maxHp: 100, shield: 50, maxShield: 50, energy: 200, maxEnergy: 200,
      gold: 0, weapons: ['pistol', null], cur: 0,
      cd: 0, invuln: 0, shieldT: 0, dashT: 0, dashCd: 0, dvx: 0, dvy: 0, ghostT: 0,
      emptyT: 0, recoil: 0, muzzle: 0, moving: false, capeX: 0, capeY: 0, stepT: 0, beam: null, near: null, walk: 0, hurtFlash: 0,
      stats: {
        dmg: 1, rate: 1, speed: 1, crit: 0.05, pierce: 0, multishot: 0, costMul: 1, bulletSpeed: 1,
        shieldDelay: 3.5, shieldRate: 14, dashCd: 1.1, killEnergy: 0, killHeal: 0, thorns: false, goldMul: 1
      }
    };
  };

  G.updatePlayer = function (dt) {
    const g = G.game, p = g.player, I = G.input, K = I.keys, s = p.stats;
    p.aim = Math.atan2(I.my + g.cam.y - p.y, I.mx + g.cam.x - p.x);

    let mx = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
    let my = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
    let ml = Math.hypot(mx, my);
    if (ml) { mx /= ml; my /= ml; }
    if (G.touch.mvx || G.touch.mvy) { mx = G.touch.mvx; my = G.touch.mvy; ml = 1; }

    p.dashCd -= dt; p.invuln -= dt; p.cd -= dt; p.emptyT -= dt; p.hurtFlash -= dt;
    p.recoil = Math.max(0, p.recoil - dt * 8);
    p.muzzle = Math.max(0, p.muzzle - dt * 14);
    p.moving = ml > 0 || p.dashT > 0;
    const cvx = p.dashT > 0 ? p.dvx / 640 * 9 : mx * 5, cvy = p.dashT > 0 ? p.dvy / 640 * 9 : my * 5, ck = 1 - Math.exp(-12 * dt);
    p.capeX += (cvx - p.capeX) * ck; p.capeY += (cvy - p.capeY) * ck;
    if (p.beam) { p.beam.t -= dt; if (p.beam.t <= 0) p.beam = null; }

    if (p.dashT > 0) {
      p.dashT -= dt;
      G.moveEntity(p, p.dvx * dt, p.dvy * dt);
      p.ghostT -= dt;
      if (p.ghostT <= 0) { p.ghostT = 0.03; g.effects.push({ type: 'ghost', x: p.x, y: p.y, t: 0, dur: 0.22 }); }
    } else {
      if (I.pressed.Space && p.dashCd <= 0) {
        const dx = ml ? mx : Math.cos(p.aim), dy = ml ? my : Math.sin(p.aim);
        p.dashT = 0.17; p.dvx = dx * 640; p.dvy = dy * 640;
        p.dashCd = s.dashCd; p.invuln = Math.max(p.invuln, 0.24);
        G.sfx('dash');
        for (let i = 0; i < 5; i++) g.effects.push({ type: 'dust', x: p.x + G.rand(-8, 8), y: p.y + 8 + G.rand(-4, 4), t: 0, dur: 0.4 });
      } else if (ml) {
        const sp = 195 * s.speed;
        G.moveEntity(p, mx * sp * dt, my * sp * dt);
        p.walk += dt * 13;
        p.stepT -= dt;
        if (p.stepT <= 0) { p.stepT = 0.2; g.effects.push({ type: 'dust', x: p.x - mx * 6, y: p.y + 10, t: 0, dur: 0.3 }); }
      }
    }

    // 护盾：一段时间未受伤后自动恢复；能量有微量自然回复
    p.shieldT -= dt;
    if (p.shieldT <= 0 && p.shield < p.maxShield) p.shield = Math.min(p.maxShield, p.shield + s.shieldRate * dt);
    if (p.energy < p.maxEnergy) p.energy = Math.min(p.maxEnergy, p.energy + 1.5 * dt);

    if (p.weapons[1]) {
      if (I.pressed.KeyQ || I.wheel) { p.cur ^= 1; p.cd = Math.max(p.cd, 0.12); G.sfx('ui'); }
      if (I.pressed.Digit1 && p.cur !== 0) { p.cur = 0; G.sfx('ui'); }
      if (I.pressed.Digit2 && p.cur !== 1) { p.cur = 1; G.sfx('ui'); }
    }
    if (I.down && p.cd <= 0 && p.dashT <= 0) G.fireWeapon(p);

    // 最近的可互动物
    p.near = null;
    let bd = 48;
    for (const it of g.items) {
      if (it.kind === 'chest' && it.opened) continue;
      const d = Math.hypot(it.x - p.x, it.y - p.y);
      if (d < bd) { bd = d; p.near = it; }
    }
    if (I.pressed.KeyE && p.near) G.interact(p.near);
  };

  G.hurtPlayer = function (dmg) {
    const g = G.game, p = g.player;
    if (g.state !== 'play' || p.invuln > 0 || p.dashT > 0 || G.debug.god) return;
    dmg = Math.round(dmg);
    g.dmgTaken += dmg;
    const abs = Math.min(p.shield, dmg);
    p.shield -= abs;
    p.hp -= dmg - abs;
    p.invuln = 0.5; p.shieldT = p.stats.shieldDelay; p.hurtFlash = 0.25;
    g.shake = Math.max(g.shake, dmg - abs > 0 ? 9 : 5);
    G.sfx('hurt');
    G.burst(p.x, p.y, dmg - abs > 0 ? '#ff5d6c' : '#8fb7ff', 8, 160, 0.35, 3);
    if (p.stats.thorns) {
      const off = Math.random() * 6.28;
      for (let i = 0; i < 12; i++) {
        const a = off + i * Math.PI / 6;
        G.spawnBullet({ friendly: true, x: p.x, y: p.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, dmg: 16 * p.stats.dmg, color: '#8fb7ff', life: 0.8 });
      }
    }
    if (p.hp <= 0) { p.hp = 0; G.endRun(false); }
  };

  // ---------- 互动：武器、宝箱、商店、传送门 ----------
  G.takeWeapon = function (it) {
    const g = G.game, p = g.player;
    if (!p.weapons[1]) {
      p.weapons[1] = it.wid; p.cur = 1;
      g.items.splice(g.items.indexOf(it), 1);
    } else {
      const old = p.weapons[p.cur];
      p.weapons[p.cur] = it.wid;
      it.wid = old; it.price = 0;
    }
    p.cd = 0.2;
    G.sfx('pick');
    G.floatText(p.x, p.y - 26, G.WEAPONS[p.weapons[p.cur]].name, '#fff', 14);
  };

  G.randomWeapon = function () {
    const p = G.game.player;
    const pool = G.WEAPON_IDS.filter(id => id !== 'pistol' && p.weapons.indexOf(id) < 0 && !G.game.items.some(it => it.wid === id));
    return G.pick(pool.length ? pool : G.WEAPON_IDS.filter(id => id !== 'pistol'));
  };

  G.interact = function (it) {
    const g = G.game, p = g.player;
    if (it.price) {
      if (p.gold < it.price) { G.floatText(p.x, p.y - 22, '金币不足', '#ffcf6b'); G.sfx('empty'); return; }
      p.gold -= it.price;
    }
    if (it.kind === 'weapon') {
      G.takeWeapon(it);
    } else if (it.kind === 'chest') {
      it.opened = true;
      G.sfx('pick');
      G.burst(it.x, it.y, '#ffd86b', 18, 200, 0.5, 3);
      g.items.push({ kind: 'weapon', wid: G.randomWeapon(), x: it.x, y: it.y + 40, price: 0 });
      for (let i = 0; i < 8; i++) G.dropPickup('coin', it.x, it.y, 2);
      for (let i = 0; i < 3; i++) G.dropPickup('energy', it.x, it.y, 15);
    } else if (it.kind === 'goods') {
      if (it.item === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 40); G.floatText(p.x, p.y - 22, '+40 生命', '#7dff9a'); }
      else if (it.item === 'energy') { p.energy = p.maxEnergy; G.floatText(p.x, p.y - 22, '能量已充满', '#6fe0ff'); }
      else if (it.item === 'perk') { G.applyPerk(it.perk); G.floatText(p.x, p.y - 22, it.perk.name, '#ffd86b', 14); }
      G.sfx('perk');
      g.items.splice(g.items.indexOf(it), 1);
    } else if (it.kind === 'portal') {
      G.sfx('portal');
      G.openPerkChoice();
    }
  };

  G.itemLabel = function (it) {
    const price = it.price ? '（' + it.price + ' 金币）' : '';
    if (it.kind === 'weapon') return (it.price ? '购买 ' : '拾取 ') + G.WEAPONS[it.wid].name + price;
    if (it.kind === 'chest') return '打开宝箱';
    if (it.kind === 'portal') return '进入传送门';
    if (it.item === 'heal') return '购买 生命药剂' + price;
    if (it.item === 'energy') return '购买 能量电池' + price;
    return '购买 ' + it.perk.name + price;
  };
})();

<script>
// 普通敌人：定义、AI、受伤与死亡
'use strict';
(function () {
  const G = window.G;
  const TAU = Math.PI * 2;

  // 朝目标移动；撞墙后短暂侧移绕开障碍
  function seek(e, tx, ty, sp, dt) {
    let a = Math.atan2(ty - e.y, tx - e.x);
    e.face = a;
    if (e.side > 0) { e.side -= dt; a += e.sideDir * 1.3; }
    const hit = G.moveEntity(e, Math.cos(a) * sp * dt, Math.sin(a) * sp * dt);
    if (hit && e.side <= 0) { e.side = 0.5; e.sideDir = Math.random() < 0.5 ? -1 : 1; }
  }
  G.seek = seek;

  function poly(ctx, n, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * TAU / n;
      if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }
  G.poly = poly;

  G.ENEMIES = {
    // 扑咬兽：靠近后蓄力冲撞
    lunger: {
      name: '扑咬兽', hp: 34, r: 12, cost: 2, touch: 14, color: '#ff6b4a',
      ai(e, dt, g, p, d, ang) {
        if (e.state === 'wind') {
          e.t -= dt;
          if (e.t <= 0) { e.state = 'dash'; e.t = 0.34; }
        } else if (e.state === 'dash') {
          e.t -= dt;
          const hit = G.moveEntity(e, Math.cos(e.face) * 430 * dt, Math.sin(e.face) * 430 * dt);
          if (e.t <= 0 || hit) { e.state = 'rest'; e.t = 0.7; }
        } else if (e.state === 'rest') {
          e.t -= dt;
          if (e.t <= 0) e.state = null;
        } else {
          seek(e, p.x, p.y, 88, dt);
          if (d < 175) { e.state = 'wind'; e.t = 0.45; e.face = ang; }
        }
      }
    },
    // 灯芯射手：保持距离，瞄准点射
    wick: {
      name: '灯芯射手', hp: 26, r: 11, cost: 2, touch: 8, color: '#ffc94a',
      ai(e, dt, g, p, d, ang) {
        if (d > 290) seek(e, p.x, p.y, 75, dt);
        else if (d < 170) seek(e, e.x * 2 - p.x, e.y * 2 - p.y, 80, dt);
        else seek(e, e.x + Math.cos(ang + 1.57 * e.dir) * 50, e.y + Math.sin(ang + 1.57 * e.dir) * 50, 55, dt);
        e.face = ang;
        e.t -= dt;
        if (e.t <= 0) {
          e.t = 1.5 + Math.random() * 0.5;
          if (Math.random() < 0.3) e.dir = -e.dir;
          G.eshoot(e.x, e.y, ang, 235, 10, { color: '#ffb84a' });
          if (g.floor >= 2) G.eshoot(e.x, e.y, ang + G.rand(-0.25, 0.25), 200, 10, { color: '#ffb84a' });
          G.sfx('eshoot');
        }
      }
    },
    // 孢子炮台：缓慢移动，周期性环形散射
    spore: {
      name: '孢子炮台', hp: 60, r: 15, cost: 3, touch: 10, color: '#7bd66a',
      ai(e, dt, g, p, d) {
        seek(e, p.x, p.y, 36, dt);
        e.t -= dt;
        if (e.t <= 0) {
          e.t = 2.5;
          e.n = (e.n || 0) + 1;
          G.ering(e.x, e.y, g.floor >= 2 ? 11 : 8, 150, 9, e.n % 2 ? 0 : 0.35, { color: '#a4ff7a' });
          G.sfx('eshoot');
        }
      }
    },
    // 爆燃虫：高速贴脸后引爆
    fuse: {
      name: '爆燃虫', hp: 20, r: 10, cost: 2, touch: 0, color: '#ff8f2e',
      ai(e, dt, g, p, d) {
        if (e.state === 'fuse') {
          e.t -= dt;
          if (e.t <= 0) { e.hp = 0; e.dead = true; e.selfBoom = true; G.explode(e.x, e.y, 72, 22 * g.dmgMul, false); G.onEnemyDeath(e); }
        } else {
          seek(e, p.x, p.y, 150, dt);
          if (d < 48) { e.state = 'fuse'; e.t = 0.5; }
        }
      }
    },
    // 巢母：远离玩家并不断产出幼体
    brood: {
      name: '巢母', hp: 95, r: 18, cost: 4, touch: 10, color: '#b06bff',
      ai(e, dt, g, p, d) {
        if (d < 230) seek(e, e.x * 2 - p.x, e.y * 2 - p.y, 60, dt);
        else if (d > 380) seek(e, p.x, p.y, 45, dt);
        e.t -= dt;
        if (e.t <= 0) {
          e.t = 3.4;
          let mites = 0;
          for (const o of g.enemies) if (o.type === 'mite') mites++;
          if (mites < 6) {
            for (let i = 0; i < 2; i++) G.spawnEnemy('mite', e.x + G.rand(-20, 20), e.y + G.rand(-20, 20), 0.4);
            G.burst(e.x, e.y, '#d6a8ff', 8, 120, 0.4, 3);
          }
        }
      }
    },
    // 幼体：脆弱但成群
    mite: {
      name: '幼体', hp: 10, r: 7, cost: 1, touch: 8, color: '#d19bff',
      ai(e, dt, g, p) {
        const wob = Math.sin(e.age * 6 + e.id) * 40;
        seek(e, p.x + Math.cos(e.id) * wob, p.y + Math.sin(e.id) * wob, 128, dt);
      }
    },
    // 凝视者：预警瞄准线后射出高速弹
    gazer: {
      name: '凝视者', hp: 40, r: 13, cost: 3, touch: 8, color: '#5ad6e6',
      ai(e, dt, g, p, d, ang) {
        if (e.state === 'aim') {
          e.t -= dt;
          if (e.t > 0.3) e.face = ang;
          if (e.t <= 0) {
            G.eshoot(e.x, e.y, e.face, 620, 18, { color: '#8af4ff', r: 6 });
            G.sfx('eshoot');
            e.state = null; e.t = 1.6 + Math.random();
          }
        } else {
          e.face = ang;
          seek(e, e.x + Math.cos(e.age * 0.7 + e.id) * 60, e.y + Math.sin(e.age * 0.9 + e.id) * 60, 40, dt);
          e.face = ang;
          e.t -= dt;
          if (e.t <= 0) { e.state = 'aim'; e.t = 1.0; }
        }
      }
    }
  };

  let nextId = 1;
  G.spawnEnemy = function (type, x, y, spawnT) {
    const g = G.game, def = G.ENEMIES[type];
    const mul = def.boss ? 1 : 1 + 0.4 * (g.floor - 1);
    const e = {
      id: nextId++, type, def, x, y, r: def.r, hp: def.hp * mul, maxhp: def.hp * mul,
      t: 0.6 + Math.random() * 1.2, state: null, face: 0, age: Math.random() * 10, flash: 0,
      spawnT: spawnT || 0, spawnMax: spawnT || 0, kx: 0, ky: 0, side: 0, sideDir: 1, dir: Math.random() < 0.5 ? -1 : 1, dead: false
    };
    if (G.collides(x, y, e.r)) { const s = G.randomSpot(g.active || g.room, 60); e.x = s.x; e.y = s.y; }
    g.enemies.push(e);
    return e;
  };

  G.hurtEnemy = function (e, dmg, crit, kx, ky) {
    if (e.dead || e.spawnT > 0) return;
    const g = G.game;
    e.hp -= dmg; e.flash = 0.09;
    if (!e.def.boss) { e.kx += kx || 0; e.ky += ky || 0; }
    g.dmgDealt += dmg;
    if (dmg >= 3 || Math.random() < 0.3) G.floatText(e.x, e.y - e.r - 4, String(Math.max(1, Math.round(dmg))), crit ? '#ffe14a' : '#fff', crit ? 16 : 12);
    G.sfx('hit');
    if (e.hp <= 0) { e.dead = true; G.onEnemyDeath(e); }
  };

  G.onEnemyDeath = function (e) {
    const g = G.game, p = g.player, def = e.def;
    g.kills++;
    G.sfx('kill');
    G.burst(e.x, e.y, def.color, def.boss ? 60 : 10, def.boss ? 380 : 190, def.boss ? 0.9 : 0.45, def.boss ? 5 : 3);
    G.shards(e.x, e.y, def.color, def.boss ? 26 : e.type === 'mite' ? 3 : 7, def.boss ? 420 : 230);
    g.effects.push({ type: 'ring', x: e.x, y: e.y, rad: e.r * 3, t: 0, dur: 0.3, color: def.color });
    G.stain(e.x, e.y + e.r * 0.5, e.r * (def.boss ? 2.2 : 1.1), G.shade(def.color, -0.72), 0.5);
    if (def.boss) { G.onBossDeath(e); return; }
    const coins = e.type === 'mite' ? (Math.random() < 0.4 ? 1 : 0) : G.randi(1, 3);
    for (let i = 0; i < coins; i++) G.dropPickup('coin', e.x, e.y, 1);
    if (Math.random() < 0.3) G.dropPickup('energy', e.x, e.y, 8);
    if (p.stats.killEnergy) p.energy = Math.min(p.maxEnergy, p.energy + p.stats.killEnergy);
    if (p.stats.killHeal && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + p.stats.killHeal);
    // 被击杀的爆燃虫会炸伤周围的敌人
    if (e.type === 'fuse' && !e.selfBoom) G.explode(e.x, e.y, 60, 30, true, false);
  };

  G.updateEnemies = function (dt) {
    const g = G.game, p = g.player, list = g.enemies;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      e.age += dt; e.flash -= dt;
      if (e.spawnT > 0) { e.spawnT -= dt; continue; }
      if (e.dead) continue;
      if (e.kx || e.ky) {
        G.moveEntity(e, e.kx * dt, e.ky * dt);
        const f = Math.pow(0.002, dt);
        e.kx *= f; e.ky *= f;
        if (Math.abs(e.kx) + Math.abs(e.ky) < 4) e.kx = e.ky = 0;
      }
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
      e.def.ai(e, dt, g, p, d, Math.atan2(dy, dx));
      if (!e.dead && e.def.touch && d < e.r + p.r - 2) G.hurtPlayer(e.def.touch * g.dmgMul);
    }
    // 互相推开，避免重叠成一团
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.spawnT > 0 || a.def.boss) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (b.spawnT > 0 || b.def.boss) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
        if (d < min && d > 0.01) {
          const push = (min - d) * 0.5, ux = dx / d, uy = dy / d;
          G.moveEntity(a, -ux * push, -uy * push);
          G.moveEntity(b, ux * push, uy * push);
        }
      }
    }
    for (let i = list.length - 1; i >= 0; i--) if (list[i].dead) list.splice(i, 1);
  };
})();

<script>
// 三个 Boss：按血量分三阶段，每阶段从招式表里轮换弹幕
'use strict';
(function () {
  const G = window.G;
  const TAU = Math.PI * 2;

  function ev(e, key, iv, dt) {
    e[key] += dt;
    if (e[key] >= iv) { e[key] -= iv; return true; }
    return false;
  }

  function bossAI(e, dt, g, p, d, ang) {
    const def = e.def, frac = e.hp / e.maxhp;
    if (e.tele !== 2) e.face = ang;
    const ph = frac > 0.66 ? 0 : frac > 0.33 ? 1 : 2;
    if (ph !== e.phase) {
      e.phase = ph; e.atk = null; e.rest = 1.0; e.tele = 0; e.alpha = 1;
      g.banner = { text: ph === 1 ? '第二阶段' : '最终阶段', t: 1.4, small: true };
      g.shake = 12;
      G.sfx('phase');
      G.burst(e.x, e.y, def.color, 30, 300, 0.6, 4);
      g.ebullets.length = 0;
    }
    if (e.rest > 0) {
      e.rest -= dt;
      if (def.drift) G.seek(e, p.x, p.y, def.drift, dt);
      return;
    }
    if (!e.atk) {
      const list = def.phases[ph];
      let nm = G.pick(list), guard = 0;
      while (nm === e.lastAtk && guard++ < 8) nm = G.pick(list);
      e.atk = e.lastAtk = nm;
      e.at = 0; e.acc = 0; e.acc2 = 0; e.n = 0; e.aimA = ang; e.tele = 0;
      e.spinDir = Math.random() < 0.5 ? -1 : 1;
    }
    e.at += dt;
    if (def.atks[e.atk](e, dt, g, p, d, ang)) { e.atk = null; e.rest = def.rest[ph]; e.tele = 0; }
  }

  // ---------- 第一层：熔炉守卫 ----------
  const warden = {
    name: '熔炉守卫', boss: true, hp: 1300, r: 30, touch: 18, color: '#ff7a3a', drift: 45,
    rest: [0.9, 0.7, 0.45],
    phases: [['fan', 'ring'], ['fan', 'spiral', 'charge', 'ring'], ['spiral', 'charge', 'ring', 'summon', 'fan']],
    atks: {
      fan(e, dt, g, p, d, ang) {
        G.seek(e, p.x, p.y, 55, dt);
        if (ev(e, 'acc', 0.55, dt)) {
          const n = e.phase ? 7 : 5;
          for (let i = 0; i < n; i++) G.eshoot(e.x, e.y, ang + (i - (n - 1) / 2) * 0.2, 225, 12, { color: '#ff9a4a' });
          G.sfx('eshoot');
        }
        return e.at > 2.4;
      },
      ring(e, dt) {
        e.tele = e.at < 0.5 ? 1 : 0;
        if (e.at > 0.5 && ev(e, 'acc', 0.45, dt)) {
          G.ering(e.x, e.y, 18, 170, 12, e.n * 0.17, { color: '#ffb36a' });
          e.n++; G.sfx('eshoot');
        }
        return e.n >= 2 + e.phase;
      },
      spiral(e, dt) {
        if (ev(e, 'acc', 0.075, dt)) {
          const arms = 2 + e.phase;
          e.n += 0.2 * e.spinDir;
          for (let i = 0; i < arms; i++) G.eshoot(e.x, e.y, e.n + i * TAU / arms, 185, 11, { color: '#ffd06a' });
        }
        return e.at > 2.8;
      },
      charge(e, dt, g, p, d, ang) {
        if (e.at < 0.65) {
          e.tele = 2;
          if (e.at < 0.45) e.aimA = ang;
          e.face = e.aimA;
        } else {
          e.tele = 0;
          const hit = G.moveEntity(e, Math.cos(e.aimA) * 540 * dt, Math.sin(e.aimA) * 540 * dt);
          if (hit || e.at > 1.25) {
            G.ering(e.x, e.y, 14, 200, 12, Math.random(), { color: '#ffb36a' });
            g.shake = 10; G.sfx('boom');
            return true;
          }
        }
        return false;
      },
      summon(e, dt) {
        if (!e.n) {
          e.n = 1;
          for (let i = 0; i < 2; i++) G.spawnEnemy('fuse', e.x + G.rand(-50, 50), e.y + G.rand(-50, 50), 0.6);
        }
        return e.at > 0.9;
      }
    },
    ai: bossAI
  };

  // ---------- 第二层：虚空织者 ----------
  const weaver = {
    name: '虚空织者', boss: true, hp: 2000, r: 26, touch: 16, color: '#58c8ff', drift: 0,
    rest: [0.8, 0.6, 0.4],
    phases: [['cross', 'gapring', 'blink'], ['cross', 'orbs', 'gapring', 'blink', 'volley'], ['cross', 'orbs', 'volley', 'gapring', 'blink']],
    atks: {
      blink(e, dt, g) {
        if (e.at < 0.3) e.alpha = 1 - e.at / 0.3;
        else if (!e.n) {
          e.n = 1;
          const s = G.randomSpot(g.active || g.room, 170);
          e.x = s.x; e.y = s.y;
          G.burst(e.x, e.y, '#9ae0ff', 14, 200, 0.4, 3);
          if (e.phase >= 1) G.ering(e.x, e.y, 12, 190, 11, Math.random(), { color: '#8ad6ff' });
          if (e.phase === 2) for (let i = 0; i < 2; i++) G.spawnEnemy('mite', e.x + G.rand(-30, 30), e.y + G.rand(-30, 30), 0.4);
        } else e.alpha = Math.min(1, (e.at - 0.3) / 0.3);
        if (e.at > 0.65) { e.alpha = 1; return true; }
        return false;
      },
      cross(e, dt) {
        if (ev(e, 'acc', 0.095, dt)) {
          const arms = e.phase === 2 ? 6 : 4;
          e.n += 0.055 * e.spinDir;
          for (let i = 0; i < arms; i++) G.eshoot(e.x, e.y, e.n + i * TAU / arms, 205, 11, { color: '#6ad0ff' });
        }
        return e.at > 3.1;
      },
      gapring(e, dt, g, p, d, ang) {
        if (ev(e, 'acc', 0.7, dt)) {
          const n = 30, gap = Math.round(((ang % TAU + TAU) % TAU) / TAU * n) + G.randi(-2, 2);
          for (let i = 0; i < n; i++) {
            const k = ((i - gap) % n + n) % n;
            if (k <= 1 || k >= n - 1 || (k >= 14 && k <= 16)) continue;
            G.eshoot(e.x, e.y, i * TAU / n, 135, 11, { color: '#b49bff' });
          }
          e.n++; G.sfx('eshoot');
        }
        return e.n >= 3 + (e.phase ? 1 : 0);
      },
      orbs(e, dt) {
        if (!e.n) {
          e.n = 1;
          const k = e.phase === 2 ? 5 : 3;
          for (let i = 0; i < k; i++) G.eshoot(e.x, e.y, i * TAU / k + Math.random(), 150, 13, { color: '#ff7ad1', r: 8, homing: 1.7, life: 4.5 });
          G.sfx('eshoot');
        }
        return e.at > 1.3;
      },
      volley(e, dt, g, p, d, ang) {
        if (ev(e, 'acc', 0.32, dt)) {
          for (let i = -1; i <= 1; i++) G.eshoot(e.x, e.y, ang + i * 0.11, 330, 12, { color: '#8af4ff' });
          e.n++; G.sfx('eshoot');
        }
        return e.n >= 5;
      }
    },
    ai: bossAI
  };

  // ---------- 第三层：烬渊之心 ----------
  const heart = {
    name: '烬渊之心', boss: true, hp: 2900, r: 34, touch: 20, color: '#d05bff', drift: 0,
    rest: [0.8, 0.6, 0.4],
    phases: [['petal', 'nova', 'lance'], ['petal', 'twin', 'nova', 'lance', 'brood'], ['twin', 'rain', 'nova', 'lance', 'petal', 'brood']],
    atks: {
      petal(e, dt) {
        if (ev(e, 'acc', 0.1, dt)) {
          const k = e.phase ? 6 : 5, base = Math.sin(e.at * 2.2) * 1.1 * e.spinDir;
          for (let i = 0; i < k; i++) G.eshoot(e.x, e.y, base + i * TAU / k, 195, 12, { color: '#ff8ae0' });
        }
        return e.at > 3.2;
      },
      twin(e, dt) {
        if (ev(e, 'acc', 0.085, dt)) {
          e.n += 0.17;
          for (let i = 0; i < 2; i++) {
            G.eshoot(e.x, e.y, e.n + i * Math.PI, 175, 12, { color: '#c08aff' });
            G.eshoot(e.x, e.y, -e.n * 1.2 + i * Math.PI + 0.5, 215, 12, { color: '#ff8ae0' });
          }
        }
        return e.at > 3.2;
      },
      nova(e, dt) {
        e.tele = e.at < 0.5 ? 1 : 0;
        if (e.at > 0.5 && ev(e, 'acc', 0.5, dt)) {
          G.ering(e.x, e.y, 24, 125 + e.n * 22, 12, e.n % 2 ? TAU / 48 : 0, { color: '#ffb36a' });
          e.n++; G.sfx('eshoot');
        }
        return e.n >= 3 + e.phase;
      },
      lance(e, dt, g, p, d, ang) {
        const t = e.at % 1.1;
        if (t < 0.5) { e.tele = 2; e.aimA = ang; e.face = ang; e.acc = 0; }
        else {
          e.tele = 0;
          if (ev(e, 'acc', 0.05, dt)) { G.eshoot(e.x, e.y, e.aimA + G.rand(-0.04, 0.04), 440, 13, { color: '#fff08a' }); G.sfx('eshoot'); }
        }
        return e.at > 1.1 * (2 + e.phase);
      },
      brood(e, dt) {
        if (!e.n) {
          e.n = 1;
          for (let i = 0; i < 3; i++) G.spawnEnemy('mite', e.x + G.rand(-60, 60), e.y + G.rand(-60, 60), 0.5);
          G.spawnEnemy('gazer', e.x + G.rand(-90, 90), e.y + G.rand(-90, 90), 0.7);
        }
        return e.at > 1.0;
      },
      rain(e, dt, g, p) {
        if (ev(e, 'acc', 0.11, dt)) {
          const a = Math.random() * TAU, x = p.x + Math.cos(a) * 290, y = p.y + Math.sin(a) * 290;
          if (!G.pointSolid(x, y)) G.eshoot(x, y, a + Math.PI + G.rand(-0.25, 0.25), 150, 12, { color: '#c08aff', life: 4 });
        }
        return e.at > 2.8;
      }
    },
    ai: bossAI
  };

  G.ENEMIES.boss1 = warden;
  G.ENEMIES.boss2 = weaver;
  G.ENEMIES.boss3 = heart;
  G.BOSS_COUNT = 3;

  G.spawnBoss = function (room) {
    const g = G.game;
    const e = G.spawnEnemy('boss' + Math.min(g.floor, 3), room.cx, room.cy, 1.5);
    e.phase = 0; e.rest = 0.8; e.atk = null; e.lastAtk = null; e.tele = 0; e.alpha = 1; e.aimA = 0;
    e.at = 0; e.acc = 0; e.acc2 = 0; e.n = 0; e.spinDir = 1;
    g.boss = e;
    g.banner = { text: e.def.name, t: 2.2 };
    G.sfx('phase');
  };

  G.onBossDeath = function (e) {
    const g = G.game, room = g.active || g.room;
    g.boss = null;
    g.ebullets.length = 0;
    for (const o of g.enemies) if (o !== e && !o.dead) { o.dead = true; G.burst(o.x, o.y, o.def.color, 8, 160, 0.4, 3); }
    g.shake = 18;
    G.sfx('boom');
    g.effects.push({ type: 'boom', x: e.x, y: e.y, rad: 160, t: 0, dur: 0.6, color: e.def.color });
    for (let i = 0; i < 24; i++) G.dropPickup('coin', e.x, e.y, 2);
    for (let i = 0; i < 5; i++) G.dropPickup('energy', e.x, e.y, 15);
    G.dropPickup('health', e.x, e.y, 30);
    room.cleared = true; room.locked = false; g.active = null;
    if (g.floor >= G.MAX_FLOOR) { g.winT = 2.6; g.banner = { text: '烬渊归于沉寂', t: 2.6 }; }
    else {
      g.items.push({ kind: 'portal', x: room.cx, y: room.cy, price: 0 });
      g.banner = { text: '传送门已开启', t: 2.2, small: true };
      G.sfx('portal');
    }
  };
})();

<script>
// 角色造型：玩家、七种敌人、三个 Boss（带描边、高光和待机/攻击动画）
'use strict';
(function () {
  const G = window.G, TAU = Math.PI * 2, OUT = '#140e14';

  function ink(ctx, fill, lw) {
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw || 2; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke();
  }
  function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function ell(ctx, x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
  function dot(ctx, x, y, r, col) { ctx.fillStyle = col; circ(ctx, x, y, r); ctx.fill(); }
  const C = (e, hex) => (e.flash > 0 ? '#ffffff' : hex);
  G.ink = ink;

  // ---------- 玩家：戴兜帽的提灯旅人 ----------
  G.drawPlayerSprite = function (ctx, p, g) {
    const ax = Math.cos(p.aim), ay = Math.sin(p.aim);
    const bob = p.moving ? Math.sin(p.walk) * 1.4 : Math.sin(g.time * 2.6) * 0.7;
    const body = p.hurtFlash > 0 ? '#ffffff' : '#34c7b5';
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.dashT > 0) { const a = Math.atan2(p.dvy, p.dvx); ctx.rotate(a); ctx.scale(1.25, 0.8); ctx.rotate(-a); }
    // 脚
    const st = p.moving ? Math.sin(p.walk) * 3 : 0;
    ctx.fillStyle = OUT; ell(ctx, -4, 11 + st * 0.4, 3.4, 2.4); ctx.fill(); ell(ctx, 4, 11 - st * 0.4, 3.4, 2.4); ctx.fill();
    // 披风随移动向后飘
    const cx = -p.capeX, cy = -p.capeY;
    ctx.beginPath(); ctx.moveTo(-8, -1 + bob); ctx.quadraticCurveTo(-11 + cx * 0.5, 7 + cy * 0.5, -7 + cx, 13 + cy);
    ctx.lineTo(-2 + cx, 10 + cy); ctx.lineTo(2 + cx, 14 + cy); ctx.lineTo(7 + cx, 11 + cy);
    ctx.quadraticCurveTo(11 + cx * 0.5, 7 + cy * 0.5, 8, -1 + bob); ctx.closePath(); ink(ctx, '#c9482e');
    // 身体与兜帽
    circ(ctx, 0, bob, 10.5); ink(ctx, body);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ell(ctx, -3, bob - 5, 5, 2.6, -0.4); ctx.fill();
    ctx.beginPath(); ctx.arc(0, bob, 10.5, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(0, bob - 4, -10.5, bob - 0.5); ctx.closePath();
    ctx.fillStyle = p.hurtFlash > 0 ? '#ffffff' : '#1e8277'; ctx.fill();
    // 面部暗影与发光双眼
    ctx.fillStyle = '#0b1f1d'; ell(ctx, ax * 3.5, bob + ay * 3.2 + 0.5, 6.2, 5.2); ctx.fill();
    const blink = (g.time * 0.35 + 0.1) % 1 < 0.03;
    if (!blink) {
      dot(ctx, ax * 5 - ay * 2.4, bob + ay * 4.4 + ax * 2.4 + 0.5, 1.5, '#ffeeb0');
      dot(ctx, ax * 5 + ay * 2.4, bob + ay * 4.4 - ax * 2.4 + 0.5, 1.5, '#ffeeb0');
    }
    // 围巾
    ctx.strokeStyle = '#ff8a3c'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, bob + 1, 9, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke(); ctx.lineCap = 'butt';

'use strict';
(function () {
  const G = window.G;

  G.FONT_T = '"STXingkai","华文行楷","STKaiti","KaiTi","楷体",' + G.FONT;
  G.text = function (ctx, str, x, y, size, color, align, bold, title) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + (title ? G.FONT_T : G.FONT);
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  };
  // 带深色描边的文字（世界内飘字、提示）
  G.textO = function (ctx, str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px ' + G.FONT;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,6,10,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  };

  let vignette = null, redVig = null;

    const c = G.mkCanvas(G.W, G.H), x = c.getContext('2d');

    gr.addColorStop(0, 'rgba(' + color + ',0)'); gr.addColorStop(1, 'rgba(' + color + ',0.75)');
    x.fillStyle = gr; x.fillRect(0, 0, G.W, G.H);
    return c;
  }

  function shadow(ctx, x, y, rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.38)';

  }

  function drawStains(ctx, g) {
    for (const s of g.stains) {
      ctx.globalAlpha = s.a; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.62, s.rot, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s.x + s.r * 0.8, s.y + s.r * 0.2, s.r * 0.35, s.r * 0.25, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawItems(ctx, g, th) {
    for (const it of g.items) {
      const bob = Math.sin(g.time * 3 + it.x) * 3;
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.kind === 'portal') {
        ctx.fillStyle = '#07050a'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 22, 0, 0, TAU); ctx.fill();
        for (let i = 0; i < 4; i++) {
          const r = 30 - i * 6, a = g.time * (1.6 + i * 0.7) * (i % 2 ? -1 : 1) + i;
          ctx.strokeStyle = i % 2 ? '#ffffff' : th.accent; ctx.lineWidth = 3.5 - i * 0.5; ctx.lineCap = 'round';

      }

        // 商店货架底座
        shadow(ctx, 0, 20, 18);
        ctx.beginPath(); ctx.moveTo(-13, 10); ctx.lineTo(13, 10); ctx.lineTo(16, 20); ctx.lineTo(-16, 20); ctx.closePath(); G.ink(ctx, '#4a4450', 2);
        ctx.fillStyle = '#6a6472'; ctx.fillRect(-13, 9, 26, 3);
      } else shadow(ctx, 0, 15, 14);

        ctx.translate(-13, bob - 2); ctx.rotate(-0.4);

      } else if (it.kind === 'chest') {
        ctx.beginPath(); ctx.rect(-15, -3, 30, 17); G.ink(ctx, it.opened ? '#5a3c1c' : '#8a5a26', 2.2);
        ctx.fillStyle = it.opened ? '#8a6a30' : '#f0bb4e'; ctx.fillRect(-15, 4, 30, 3);
        ctx.fillRect(-10, -3, 3, 17); ctx.fillRect(7, -3, 3, 17);
        if (it.opened) {
          ctx.beginPath(); ctx.rect(-13, -7, 26, 6); G.ink(ctx, '#140c06', 2);
          ctx.beginPath(); ctx.moveTo(-15, -7); ctx.lineTo(-13, -17); ctx.lineTo(13, -17); ctx.lineTo(15, -7); ctx.closePath(); G.ink(ctx, '#6e4520', 2.2);
        } else {
          ctx.beginPath(); ctx.moveTo(-15, -3); ctx.quadraticCurveTo(-15, -16, 0, -16); ctx.quadraticCurveTo(15, -16, 15, -3); ctx.closePath(); G.ink(ctx, '#b47a2c', 2.2);

          ctx.beginPath(); ctx.arc(0, 2, 10, 0, TAU); G.ink(ctx, '#ff5d6c', 2);
          ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-4, -2, 3, 5, 0.5, 0, TAU); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.fillRect(-1.5, -2.5, 3, 10); ctx.fillRect(-5, 1, 10, 3);
